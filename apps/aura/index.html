<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0614">
<meta name="description" content="AURA — фарми ауру каждый день. Вайб-чек, дропы ауралингов, мини-игры и лиги.">
<title>AURA — фарми ауру</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js" async></script>
<style>
:root{
  --bg:#0b0614; --bg2:#140a24; --card:rgba(255,255,255,.06); --card2:rgba(255,255,255,.1);
  --line:rgba(255,255,255,.12); --text:#f5f0ff; --dim:#a596c4; --dim2:#6f6390;
  --acc:#b46bff; --acc2:#ff5cc8; --lime:#c6ff4a; --gold:#ffd23f; --red:#ff4d6d; --cyan:#4ef0ff;
  --aura:#b46bff; --aura2:#ff5cc8;
  --r:22px; --head:'Unbounded',system-ui,sans-serif; --body:'Manrope',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--body);overflow:hidden;
  user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
body::before{content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;
  background:radial-gradient(40% 30% at 20% 10%,color-mix(in srgb,var(--aura) 35%,transparent),transparent 70%),
             radial-gradient(40% 30% at 85% 35%,color-mix(in srgb,var(--aura2) 25%,transparent),transparent 70%),
             radial-gradient(50% 40% at 50% 100%,rgba(78,240,255,.12),transparent 70%);
  filter:blur(10px);transition:background 1s}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column}
/* header */
.top{display:flex;align-items:center;gap:10px;padding:calc(var(--safe-t) + 12px) 16px 8px}
.ava{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--aura),var(--aura2));
  display:grid;place-items:center;font-size:22px;box-shadow:0 6px 20px color-mix(in srgb,var(--aura) 50%,transparent)}
.who{flex:1;min-width:0}
.who b{display:block;font-family:var(--head);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12px;color:var(--dim)}
.bal{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:14px}
.bal b{font-family:var(--head);font-size:15px}
.aic{width:18px;height:18px;border-radius:50%;flex:none;background:conic-gradient(from 0deg,var(--aura),var(--aura2),var(--cyan),var(--aura));
  box-shadow:0 0 10px var(--aura)}
/* views */
main{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;padding:4px 16px calc(96px + var(--safe-b));display:none;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.active{display:block;animation:vin .25s ease}
@keyframes vin{from{opacity:0;transform:translateY(8px)}}
h2{font-family:var(--head);font-size:20px;margin:14px 0 10px;letter-spacing:-.01em}
h3{font-family:var(--head);font-size:15px;margin:18px 0 10px}
.dim{color:var(--dim)} .small{font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:16px;font-weight:800;
  background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 8px 24px rgba(180,107,255,.35);transition:transform .1s,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn.lime{background:var(--lime);color:#14081f;box-shadow:0 8px 24px rgba(198,255,74,.25)}
.btn.ghost{background:var(--card2);box-shadow:none;border:1px solid var(--line)}
.btn.gold{background:linear-gradient(135deg,#ffd23f,#ff9f1c);color:#2a1500;box-shadow:0 8px 24px rgba(255,210,63,.3)}
.btn.sm{padding:8px 12px;border-radius:12px;font-size:13px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--card2);font-size:12px;font-weight:700}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--aura),var(--aura2));transition:width .3s}
/* farm */
.lvl{margin-top:6px}
.lvl .row{justify-content:space-between;font-size:12px;margin-bottom:6px}
.orbwrap{position:relative;height:330px;display:grid;place-items:center;margin:4px 0}
.orb{position:relative;width:250px;height:250px;border-radius:50%;touch-action:manipulation;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),transparent 18%),
             radial-gradient(circle at 50% 50%,var(--aura) 0%,var(--aura2) 55%,#1a0b30 75%);
  box-shadow:0 0 60px color-mix(in srgb,var(--aura) 70%,transparent),0 0 140px color-mix(in srgb,var(--aura2) 40%,transparent),inset 0 -20px 50px rgba(0,0,0,.45);
  transition:transform .07s}
.orb::before{content:"";position:absolute;inset:-18px;border-radius:50%;
  background:conic-gradient(from 0deg,transparent,var(--aura),transparent 30%,var(--aura2),transparent 60%,var(--cyan),transparent);
  filter:blur(14px);opacity:.75;animation:spin 6s linear infinite;z-index:-1}
.orb::after{content:"";position:absolute;inset:22%;border-radius:50%;border:2px solid rgba(255,255,255,.25);animation:pulse 2.4s ease-in-out infinite}
.orb.hit{transform:scale(.94)}
.orb .face{position:absolute;inset:0;display:grid;place-items:center;font-size:74px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.35));pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.15);opacity:.2}}
.combo{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-family:var(--head);font-size:14px;color:var(--lime);
  text-shadow:0 0 12px rgba(198,255,74,.6);opacity:0;transition:opacity .2s}
.combo.on{opacity:1}
.storm{position:absolute;top:8px;right:0;font-size:12px}
.float{position:fixed;pointer-events:none;font-family:var(--head);font-weight:900;font-size:22px;z-index:50;
  text-shadow:0 2px 10px rgba(0,0,0,.5);animation:fl .9s ease-out forwards}
.float.crit{color:var(--gold);font-size:34px}
@keyframes fl{to{transform:translateY(-110px) scale(1.2);opacity:0}}
.pt{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:49;background:var(--aura2);
  box-shadow:0 0 8px var(--aura2);animation:pt .6s ease-out forwards}
@keyframes pt{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.energy{display:flex;align-items:center;gap:10px;font-weight:800}
.energy .bar{flex:1;height:12px}
.energy .bar i{background:linear-gradient(90deg,var(--lime),var(--cyan))}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.quick button{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;text-align:left}
.quick b{display:block;font-size:14px}
.up{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.up .ic{width:46px;height:46px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:22px;flex:none}
.up b{font-size:14px}
.up .lv{font-size:11px;color:var(--dim);margin-left:6px}
/* daily */
.vibe{min-height:180px;background:linear-gradient(160deg,color-mix(in srgb,var(--aura) 35%,transparent),color-mix(in srgb,var(--aura2) 20%,transparent));}
.vibe .big{font-family:var(--head);font-size:26px;line-height:1.1;margin:6px 0}
.vibe .pro{font-size:15px;line-height:1.4;margin:10px 0 14px}
.streak{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0}
.sd{aspect-ratio:.8;border-radius:12px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;gap:2px;border:1px solid transparent}
.sd b{font-size:16px}
.sd.done{background:color-mix(in srgb,var(--lime) 22%,transparent);border-color:var(--lime)}
.sd.now{border-color:var(--acc2);box-shadow:0 0 14px rgba(255,92,200,.4);animation:pulse2 1.4s infinite}
@keyframes pulse2{50%{transform:scale(1.06)}}
.q{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q .bar{margin-top:6px;height:6px}
.q.claimed{opacity:.45}
/* games */
.game{display:flex;gap:14px;align-items:center;cursor:pointer}
.game .gi{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;font-size:36px;flex:none}
.game b{font-family:var(--head);font-size:15px}
.soon{opacity:.5;filter:grayscale(.5)}
/* drops */
.dropbox{text-align:center;padding:22px 16px}
.box{font-size:92px;display:inline-block;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 10px 30px var(--aura))}
@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
.box.shake{animation:shake .12s linear infinite}
@keyframes shake{25%{transform:rotate(-8deg) scale(1.05)}75%{transform:rotate(8deg) scale(1.1)}}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{aspect-ratio:.78;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px;text-align:center;position:relative}
.cell .e{font-size:30px}
.cell .n{font-size:9px;line-height:1.1;color:var(--dim)}
.cell.lock .e{filter:brightness(0) opacity(.35)}
.cell .cnt{position:absolute;top:4px;right:6px;font-size:10px;font-weight:800;color:var(--dim)}
.r-c{--rc:#9aa3b5}.r-r{--rc:#4ea8ff}.r-e{--rc:#b46bff}.r-l{--rc:#ffd23f}.r-m{--rc:#ff5cc8}
.cell:not(.lock){border-color:color-mix(in srgb,var(--rc) 60%,transparent);box-shadow:inset 0 0 18px color-mix(in srgb,var(--rc) 25%,transparent)}
.rar{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--rc)}
/* top */
.lb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px}
.lb:nth-child(odd){background:rgba(255,255,255,.03)}
.lb .p{width:28px;font-family:var(--head);font-size:13px;color:var(--dim);text-align:center}
.lb .av{width:34px;height:34px;border-radius:11px;background:var(--card2);display:grid;place-items:center;font-size:17px}
.lb.me{background:linear-gradient(90deg,color-mix(in srgb,var(--aura) 40%,transparent),transparent)!important;border:1px solid var(--aura)}
.lb.up1 .p{color:var(--lime)} .lb.dn .p{color:var(--red)}
.zone{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim2);padding:6px 12px}
/* nav */
nav{position:absolute;left:12px;right:12px;bottom:calc(10px + var(--safe-b));display:flex;justify-content:space-around;
  background:rgba(20,10,36,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:24px;padding:8px;z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700;color:var(--dim);padding:6px 0;border-radius:16px;position:relative}
nav button span{font-size:22px;filter:grayscale(.8);transition:transform .2s}
nav button.active{color:var(--text);background:var(--card2)}
nav button.active span{filter:none;transform:translateY(-2px) scale(1.1)}
nav button i{position:absolute;top:4px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--acc2);box-shadow:0 0 8px var(--acc2);display:none}
nav button.dot i{display:block}
/* modal */
.modal{position:fixed;inset:0;z-index:40;background:rgba(5,2,10,.7);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal.open{opacity:1;pointer-events:auto}
.sheet{position:relative;width:100%;max-width:480px;max-height:92dvh;overflow-y:auto;background:linear-gradient(180deg,#1d0f33,#120922);border:1px solid var(--line);border-bottom:0;
  border-radius:28px 28px 0 0;padding:22px 18px calc(22px + var(--safe-b));transform:translateY(30px);transition:transform .25s}
.modal.open .sheet{transform:none}
.sheet .x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:12px;background:var(--card2)}
.center{text-align:center}
.reveal{font-size:84px;margin:10px 0;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}}
.glow{filter:drop-shadow(0 0 24px var(--rc,var(--aura)))}
#toast{position:fixed;left:50%;top:calc(var(--safe-t) + 14px);transform:translate(-50%,-80px);z-index:60;background:#241340;border:1px solid var(--line);
  padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;transition:transform .3s;max-width:90vw;text-align:center}
#toast.on{transform:translate(-50%,0)}
input.txt{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:16px;outline:none}
input.txt:focus{border-color:var(--acc)}
.tog{width:48px;height:28px;border-radius:99px;background:var(--card2);position:relative;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.tog.on{background:var(--acc)} .tog.on::after{transform:translateX(20px)}
/* game overlay */
#game{position:fixed;inset:0;z-index:30;background:#07030f;display:none;touch-action:none}
#game.on{display:block}
#gc{width:100%;height:100%;display:block}
.ghud{position:absolute;top:calc(var(--safe-t) + 12px);left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;font-family:var(--head)}
.ghud .s{font-size:28px}
.ghud button{pointer-events:auto}
/* vibe/cringe & reaction */
.vc{min-height:200px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border-radius:24px;
  background:linear-gradient(160deg,rgba(180,107,255,.25),rgba(255,92,200,.12));border:1px solid var(--line);font-family:var(--head);font-size:20px;line-height:1.25;margin:12px 0}
.vcb{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vcb .btn{padding:18px;font-size:17px}
.pct{margin-top:12px}
.react{height:300px;border-radius:24px;display:grid;place-items:center;font-family:var(--head);font-size:22px;text-align:center;padding:20px;transition:background .1s;margin:12px 0}
.react.wait{background:#3a1030}.react.go{background:#1f7a3a}.react.idle{background:var(--card2)}
.ad{height:260px;border-radius:20px;display:grid;place-items:center;text-align:center;background:repeating-linear-gradient(45deg,#1d0f33,#1d0f33 12px,#24143f 12px,#24143f 24px);border:1px dashed var(--line);margin:12px 0}
.ad b{font-family:var(--head);font-size:48px}
.pass{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.tier{flex:none;width:76px;border-radius:16px;background:var(--card);border:1px solid var(--line);padding:8px 4px;text-align:center;font-size:11px}
.tier .t{font-family:var(--head);font-size:12px;color:var(--dim)}
.tier .rw{font-size:22px;margin:6px 0 2px}
.tier.got{border-color:var(--lime)} .tier.can{border-color:var(--acc2);box-shadow:0 0 12px rgba(255,92,200,.4)}
.tier.prem{opacity:.55}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat div{background:var(--card);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--head);font-size:16px;margin-top:2px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="ava" id="avaBtn" aria-label="Профиль">😎</button>
    <div class="who"><b id="hName">—</b><span id="hTitle"></span></div>
    <div class="bal"><span class="aic"></span><b id="hAura">0</b></div>
  </header>
  <main>
    <section class="view active" id="v-farm"></section>
    <section class="view" id="v-daily"></section>
    <section class="view" id="v-games"></section>
    <section class="view" id="v-drops"></section>
    <section class="view" id="v-top"></section>
  </main>
  <nav id="nav">
    <button data-v="farm" class="active"><span>🔮</span>Фарм<i></i></button>
    <button data-v="daily"><span>📅</span>Дейли<i></i></button>
    <button data-v="games"><span>🕹️</span>Игры<i></i></button>
    <button data-v="drops"><span>🎁</span>Дропы<i></i></button>
    <button data-v="top"><span>🏆</span>Топ<i></i></button>
  </nav>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<div id="game"><canvas id="gc"></canvas>
  <div class="ghud"><div><div class="small dim" style="font-family:var(--body)">ОЧКИ</div><div class="s" id="gScore">0</div></div>
  <div id="gLives" style="font-size:22px"></div><button class="btn ghost sm" id="gQuit">✕</button></div>
</div>

<script>
'use strict';
/* =========================================================
   AURA — daily aura-farming app (single file, no backend)
   ========================================================= */
const CONFIG = {
  BOT_LINK: 'https://t.me/your_aura_bot/app',   // ссылка на Mini App для инвайтов
  AD_LIMIT: 10,                                  // реклам в день
  FREE_REFILLS: 3,
  OFFLINE_HOURS: 3,
};
const $ = s => document.querySelector(s);
const TG = () => (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) ? window.Telegram.WebApp : null;
const DAY = 864e5;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const tzOff = () => new Date().getTimezoneOffset() * 60000;
const dayNum = () => Math.floor((Date.now() - tzOff()) / DAY);
const weekIdx = () => Math.floor((dayNum() + 3) / 7);           // неделя с понедельника
const weekEndMs = () => ((weekIdx() + 1) * 7 - 3) * DAY + tzOff();
function hash(s){ let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619);} return h>>>0; }
function rng(seed){ return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1|seed); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0) / 4294967296; }; }
function pick(r, arr){ return arr[Math.floor(r()*arr.length)]; }
function fmt(n){ n = Math.floor(n); if (n < 1e4) return n.toLocaleString('ru-RU');
  const u = [[1e12,'T'],[1e9,'B'],[1e6,'M'],[1e3,'K']]; for (const [v,s] of u) if (n >= v) return (n/v).toFixed(n/v < 100 ? 1 : 0).replace('.0','') + s; return ''+n; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function timeLeft(ms){ ms = Math.max(0, ms); const d = Math.floor(ms/DAY), h = Math.floor(ms%DAY/36e5), m = Math.floor(ms%36e5/6e4);
  return d ? `${d}д ${h}ч` : h ? `${h}ч ${m}м` : `${m}м`; }

/* ---------------- CONTENT ---------------- */
const TITLES = [[0,'NPC','🤖'],[1e3,'Нормис','🙂'],[1e4,'Вайбер','😎'],[5e4,'Main Character','🎬'],[2e5,'Сигма','🗿'],
  [1e6,'Аура-фармер','🔥'],[5e6,'Легенда ауры','👑'],[2.5e7,'Мифический','🌌'],[1e8,'Абсолют','✨']];
const DROP_COST = [1000,3000,10000,30000,100000,300000,1e6,3e6,1e7];

const COLORS = [
  {n:'Фиолетовая', c:'#b46bff', c2:'#ff5cc8', t:'Творец', d:'Сегодня у тебя идеи уровня «а почему так никто не сделал». Записывай всё.'},

  for (const k in SETS){ const all = CREAT.filter(c=>c.set===k); if (all.every(c=>S.cards[c.id])) b += SETS[k][1]; } return b; }

    while (qs.length < 4){ const q = pool.splice(Math.floor(r()*pool.length),1)[0]; qs.push({id:q.id, n:pick(r,q.n), p:0, c:0}); }
    S.daily = {day:d, quests:qs, vibe:false, ads:0, refills:CONFIG.FREE_REFILLS, freeDrop:true, rushPlays:0, vc:false, react:false, shared:false};
    save(true);

  for (const q of S.daily.quests){ const def = QUESTS.find(x=>x.id===q.id); if (def.ev !== ev || q.c) continue;
    const old = q.p; q.p = def.max ? Math.max(q.p, v) : q.p + v; q.p = Math.min(q.p, q.n);
    if (old < q.n && q.p >= q.n){ toast(`✅ Квест выполнен: ${def.t(q.n)}`); changed = true; } }

function botsFor(week, league){ const r = rng(hash('lg' + week + ':' + league)); const out = [];

function standings(week = weekIdx(), frac){ if (frac === undefined){ const wEnd = ((week+1)*7-3)*DAY + tzOff(); frac = clamp(1 - (wEnd - Date.now())/(7*DAY), 0.02, 1); }
  const L = LEAGUES[S.league];
  const rows = botsFor(week, S.league).map(b => ({name:b.name, av:b.av, s:Math.round(L.b*b.f*Math.pow(frac,b.e))}));
  rows.push({name:S.name||'Ты', av:TITLES[titleIdx()][2], s:Math.round(S.weekly), me:true});
  return rows.sort((a,b)=>b.s-a.s); }
let pendingWeek = null;
function weekRollover(){ const rows = standings(S.week, 1); const place = rows.findIndex(r=>r.me) + 1; const old = S.league;
  let res = 'stay';
  if (S.weekly > 0 && place <= 5 && S.league < LEAGUES.length-1){ S.league++; res='up'; }
  else if (place > 25 && S.league > 0){ S.league--; res='down'; }
  const prize = S.weekly > 0 ? Math.round(rewardScale() * (place===1?20:place<=3?12:place<=10?6:2) * (old+1)) : 0;
  pendingWeek = {place, res, prize, from:old, to:S.league};
  S.weekly = 0; S.week = weekIdx(); save(true); }

function beep(f=520, d=.06, type='sine', v=.04){ if (!S.set.sound) return; try { AC = AC || new (window.AudioContext||window.webkitAudioContext)();
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, AC.currentTime);
  g.gain.setValueAtTime(v, AC.currentTime); g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + d); o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + d); } catch(e){} }

  if (t && t.HapticFeedback){ if (kind==='success'||kind==='error'||kind==='warning') t.HapticFeedback.notificationOccurred(kind); else t.HapticFeedback.impactOccurred(kind); }
  else if (navigator.vibrate) navigator.vibrate(kind==='light'?8:kind==='error'?[30,40,30]:20); } catch(e){} }

function floatText(x, y, text, crit){ const el = document.createElement('div'); el.className = 'float' + (crit?' crit':''); el.textContent = text;
  el.style.left = (x - 20 + (Math.random()*30-15)) + 'px'; el.style.top = (y - 30) + 'px'; document.body.appendChild(el); setTimeout(()=>el.remove(), 900); }

function wrap(x, text, cx, y, maxW, lh){ const words = text.split(' '); let line = ''; for (const w of words){ const t = line + w + ' ';
  if (x.measureText(t).width > maxW && line){ x.fillText(line.trim(), cx, y); line = w + ' '; y += lh; } else line = t; } x.fillText(line.trim(), cx, y); }

/* Vibe or Cringe */
function startVC(){ const r = rng(hash('vc' + dayNum())); const pool = VC.slice(); const items = [];
  for (let i=0;i<8;i++) items.push(pool.splice(Math.floor(r()*pool.length),1)[0]);
  let i = 0, agree = 0, vibes = 0;
  const step = () => { const t = items[i]; const pct = 18 + hash(t) % 65;   // % считающих это вайбом
    const s = openModal(`<div class="small dim center">ТЕМА ${i+1} / 8</div><div class="vc">${esc(t)}</div><div id="vcRes"></div>
      <div class="vcb"><button class="btn" data-a="1">💜 Вайб</button><button class="btn ghost" data-a="0">🤢 Кринж</button></div>`);
    s.querySelector('.vcb').onclick = e => { const b = e.target.closest('[data-a]'); if (!b) return; const v = b.dataset.a === '1'; vibes += v;
      const maj = pct >= 50 ? v : !v; agree += maj; buzz(maj?'success':'warning'); beep(maj?880:300,.1);
      s.querySelector('.vcb').innerHTML = `<button class="btn wide" style="grid-column:span 2" id="vcNext">${i<7?'Дальше →':'Результат'}</button>`;
      s.querySelector('#vcRes').innerHTML = `<div class="pct"><div class="row small" style="justify-content:space-between"><span>💜 Вайб ${pct}%</span><span>🤢 Кринж ${100-pct}%</span></div>
        <div class="bar" style="height:12px;margin-top:6px"><i style="width:${pct}%"></i></div><p class="center small" style="margin:10px 0">${maj?'Ты с большинством 🤝':'Ты в меньшинстве — уникум 🦄'}</p></div>`;
      s.querySelector('#vcNext').onclick = () => { i++; i < 8 ? step() : finish(); }; }; };
  const finish = () => { const persona = agree >= 7 ? ['🧠','Голос поколения','Ты буквально чувствуешь тренды'] : agree >= 5 ? ['😎','В потоке','Ловишь вайб, но со своим мнением'] :
      agree >= 3 ? ['🦄','Индивидуалист','Свой стиль важнее мнения толпы'] : ['👽','Пришелец','Ты из будущего. Тренды догонят тебя через год'];
    let g = 0; if (!S.daily.vc){ S.daily.vc = true; g = earn(rewardScale()*3); addXP(20); track('vc'); }
    openModal(`<div class="center"><div class="reveal">${persona[0]}</div><h2>${persona[1]}</h2><p class="dim">${persona[2]}</p>
      <p style="margin:14px 0">Совпадение с большинством: <b>${agree}/8</b><br>Ты назвал вайбом: <b>${vibes}/8</b></p>${g?`<p class="dim">+${fmt(g)} ауры</p>`:'<p class="dim small">Награда уже получена сегодня</p>'}
      <button class="btn wide" data-close>Готово</button></div>`, {onClose:renderCur}); jingle(); save(); };
  step(); }

/* Reaction test */
function startReact(){ let round = 0, times = [], state = 'idle', t0 = 0, to = 0;
  const s = openModal(`<h2>⚡ Реакция</h2><p class="dim small">Жди зелёный — и жми как можно быстрее. 5 раундов.</p><div class="react idle" id="rz">Нажми, чтобы начать</div><div class="center small dim" id="rInfo"></div>`, {onClose:()=>clearTimeout(to)});
  const z = s.querySelector('#rz'), info = s.querySelector('#rInfo');
  const arm = () => { state = 'wait'; z.className = 'react wait'; z.textContent = 'Жди…'; to = setTimeout(()=>{ state = 'go'; z.className = 'react go'; z.textContent = 'ЖМИ!'; t0 = performance.now(); beep(990,.08); }, 1200 + Math.random()*2600); };
  z.onpointerdown = () => {
    if (state === 'idle'){ arm(); return; }
    if (state === 'wait'){ clearTimeout(to); state = 'idle'; z.className = 'react idle'; z.textContent = 'Рано! 🙃 Нажми, чтобы повторить'; buzz('error'); return; }
    if (state === 'go'){ const ms = Math.round(performance.now() - t0); times.push(ms); round++; buzz('medium'); info.textContent = times.map(t=>t+' мс').join(' · ');
      if (round < 5){ state = 'idle'; z.className = 'react idle'; z.textContent = `${ms} мс — нажми для раунда ${round+1}`; }
      else { state = 'done'; const avg = Math.round(times.reduce((a,b)=>a+b,0)/times.length);
        const rank = avg < 220 ? ['🥷','Кибер-ниндзя'] : avg < 270 ? ['⚡','Молния'] : avg < 330 ? ['😎','Норм реакция'] : avg < 420 ? ['😴','Сонный'] : ['🐌','Улиткин одобряет'];
        if (!S.best.react || avg < S.best.react) S.best.react = avg;
        let g = 0; if (!S.daily.react){ S.daily.react = true; g = earn(rewardScale() * clamp((480-avg)/120, .5, 2.5)); addXP(20); track('react'); }
        save(); z.className = 'react idle'; z.innerHTML = `<div><div style="font-size:56px">${rank[0]}</div>${avg} мс<div class="small dim" style="font-family:var(--body);margin-top:6px">${rank[1]}${g?` · +${fmt(g)} ауры`:''}</div></div>`; jingle(); } } };
}

/* Aura Rush — canvas arcade */
const Rush = { raf:0,
  start(){ const cv = $('#gc'); this.cv = cv; this.x = cv.getContext('2d'); $('#game').classList.add('on'); this.resize();
    const W = this.W, H = this.H; Object.assign(this, {px:W/2, tx:W/2, items:[], parts:[], score:0, lives:3, t:0, spawn:0, speed:H*.32, over:false, magnet:0, shield:0, dbl:0, last:performance.now(),
      stars:Array.from({length:60},()=>({x:Math.random()*W, y:Math.random()*H, s:Math.random()*2+.5}))});
    this.col = getComputedStyle(document.documentElement).getPropertyValue('--aura').trim() || '#b46bff';
    this.hud(); cancelAnimationFrame(this.raf); this.raf = requestAnimationFrame(t=>this.loop(t)); },
  resize(){ const d = Math.min(2, devicePixelRatio||1); this.W = innerWidth; this.H = innerHeight; this.cv.width = this.W*d; this.cv.height = this.H*d; this.x.setTransform(d,0,0,d,0,0); },
  hud(){ $('#gScore').textContent = this.score; $('#gLives').textContent = '💜'.repeat(Math.max(0,this.lives)) + (this.shield>0?' 🛡️':'') + (this.magnet>0?' 🧲':'') + (this.dbl>0?' ×2':''); },
  loop(now){ if (this.over) return; const dt = Math.min(.05, (now - this.last)/1000); this.last = now; this.t += dt; this.update(dt); this.draw(); this.raf = requestAnimationFrame(t=>this.loop(t)); },
  update(dt){ const W = this.W, H = this.H, py = H - 130;
    this.speed = H*(.32 + Math.min(this.t, 90)*.012); this.px += (this.tx - this.px) * Math.min(1, dt*14);
    this.spawn -= dt; if (this.spawn <= 0){ this.spawn = Math.max(.22, .75 - this.t*.006);
      const r = Math.random(); const k = r < .6 ? 'orb' : r < .68 ? 'gold' : r < .955 ? 'bad' : ['mag','shd','dbl'][Math.floor(Math.random()*3)];
      this.items.push({k, x: 24 + Math.random()*(W-48), y:-30, r: k==='bad' ? 22 : 14, vx: k==='bad' && this.t > 20 ? (Math.random()-.5)*60 : 0, w:Math.random()*6}); }
    for (const s of this.stars){ s.y += s.s * dt * 40 * (1 + this.t/40); if (s.y > H) { s.y = 0; s.x = Math.random()*W; } }
    for (const it of this.items){ it.y += this.speed * dt * (it.k==='bad' ? 1.1 : 1); it.x += it.vx*dt; it.w += dt*4;
      if (this.magnet > 0 && it.k !== 'bad'){ const dx = this.px - it.x, dy = py - it.y; const d = Math.hypot(dx,dy); if (d < 220){ it.x += dx/d*400*dt; it.y += dy/d*400*dt; } }
      const d = Math.hypot(it.x - this.px, it.y - py);
      if (d < it.r + 22 && !it.dead){ it.dead = true;
        if (it.k === 'bad'){ if (this.shield > 0){ this.shield = 0; this.burst(it.x,it.y,'#4ef0ff',14); beep(600,.1); } else { this.lives--; this.burst(it.x,it.y,'#ff4d6d',20); buzz('error'); beep(140,.25,'sawtooth',.05); this.flash = .3; if (this.lives <= 0) return this.end(); } }
        else if (it.k === 'orb' || it.k === 'gold'){ const v = (it.k==='gold'?5:1) * (this.dbl>0?2:1); this.score += v; this.burst(it.x,it.y,it.k==='gold'?'#ffd23f':this.col,8); beep(500 + (this.score%12)*40,.05); buzz('light'); }
        else { if (it.k==='mag') this.magnet = 7; if (it.k==='shd') this.shield = 1; if (it.k==='dbl') this.dbl = 8; this.burst(it.x,it.y,'#c6ff4a',16); beep(1000,.15,'triangle'); buzz('medium'); }
        this.hud(); } }
    this.items = this.items.filter(i => !i.dead && i.y < H + 40);
    this.magnet = Math.max(0, this.magnet - dt); this.dbl = Math.max(0, this.dbl - dt); this.flash = Math.max(0, (this.flash||0) - dt);
    for (const p of this.parts){ p.x += p.vx*dt; p.y += p.vy*dt; p.l -= dt; } this.parts = this.parts.filter(p=>p.l>0);
    if (Math.floor(this.t*4) !== this._h){ this._h = Math.floor(this.t*4); this.hud(); } },
  burst(x,y,c,n){ for (let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, s = 60+Math.random()*200; this.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5,c}); } },
  draw(){ const x = this.x, W = this.W, H = this.H, py = H - 130;
    const g = x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#07030f'); g.addColorStop(1,'#1d0f33'); x.fillStyle = g; x.fillRect(0,0,W,H);
    if (this.flash > 0){ x.fillStyle = `rgba(255,77,109,${this.flash})`; x.fillRect(0,0,W,H); }
    x.fillStyle = '#ffffff55'; for (const s of this.stars){ x.fillRect(s.x, s.y, s.s, s.s*3); }
    x.textAlign = 'center'; x.textBaseline = 'middle';
    for (const it of this.items){
      if (it.k === 'orb' || it.k === 'gold'){ const c = it.k==='gold' ? '#ffd23f' : this.col; x.shadowColor = c; x.shadowBlur = 18; x.fillStyle = c;
        x.beginPath(); x.arc(it.x, it.y, it.r + Math.sin(it.w)*2, 0, Math.PI*2); x.fill(); x.shadowBlur = 0; x.fillStyle = '#fff9'; x.beginPath(); x.arc(it.x-4, it.y-4, 4, 0, Math.PI*2); x.fill(); }
      else { x.font = `${it.k==='bad'?40:32}px serif`; x.fillText(it.k==='bad' ? (it.w%12<6?'💀':'🤡') : it.k==='mag'?'🧲':it.k==='shd'?'🛡️':'⭐', it.x, it.y); } }
    for (const p of this.parts){ x.globalAlpha = p.l*2; x.fillStyle = p.c; x.fillRect(p.x-3,p.y-3,6,6); } x.globalAlpha = 1;
    const pc = this.shield > 0 ? '#4ef0ff' : this.col; x.shadowColor = pc; x.shadowBlur = 30;
    const rg = x.createRadialGradient(this.px-6, py-6, 2, this.px, py, 26); rg.addColorStop(0,'#fff'); rg.addColorStop(.3,pc); rg.addColorStop(1,'#ff5cc8');
    x.fillStyle = rg; x.beginPath(); x.arc(this.px, py, 24, 0, Math.PI*2); x.fill(); x.shadowBlur = 0;
    if (this.magnet > 0){ x.strokeStyle = '#c6ff4a55'; x.lineWidth = 2; x.beginPath(); x.arc(this.px, py, 220, 0, Math.PI*2); x.stroke(); }
    if (this.t < 2.5){ x.fillStyle = '#fff'; x.font = '700 18px Manrope, sans-serif'; x.fillText('Води пальцем ← →  Лови ауру, избегай 💀🤡', W/2, H/2); } },
  end(){ this.over = true; cancelAnimationFrame(this.raf); const sc = this.score; const rec = sc > S.best.rush; if (rec) S.best.rush = sc;
    S.games.rush++; S.daily.rushPlays++; track('rush'); track('rushScore', sc); addXP(20);
    const k = Math.max(4, tapPower()*3) * (S.daily.rushPlays > 5 ? .5 : 1); const base = Math.round(sc * k);
    setTimeout(()=>{ $('#game').classList.remove('on');
      let claimed = false; const claim = (m) => { if (claimed) return; claimed = true; const g = earn(base*m); toast(`+${fmt(g)} ауры ☄️`); closeModal(true); renderCur(); };
      const s = openModal(`<div class="center"><div class="reveal">${rec?'🏆':sc>50?'🔥':'☄️'}</div><h2>${rec?'Новый рекорд!':'Игра окончена'}</h2>
        <p style="font-family:var(--head);font-size:40px;margin:6px 0">${sc}</p><p class="dim">Рекорд: ${S.best.rush}</p><p style="margin:12px 0">Награда: <b>${fmt(base*mult())}</b> ✨</p>
        <div class="row" style="gap:8px"><button class="btn ghost grow" id="rC">Забрать</button><button class="btn gold grow" id="rA">×2 за 📺</button></div>
        <button class="btn wide" style="margin-top:10px" id="rR">Ещё раз ↻</button></div>`, {lock:true});
      s.querySelector('#rC').onclick = () => claim(1);
      s.querySelector('#rA').onclick = () => { if (S.daily.ads >= CONFIG.AD_LIMIT) return toast('Лимит рекламы на сегодня 🙏'); closeModal(true); showAd(()=>{ claimed = true; const g = earn(base*2); toast(`+${fmt(g)} ауры ☄️`); }); };
      s.querySelector('#rR').onclick = () => { claim(1); Rush.start(); }; save(true); }, 500); },
  quit(){ if (this.over) return; this.lives = 0; this.end(); } };

      <div><span class="small dim">Критов</span><b>${fmt(S.crits)}</b></div><div><span class="small dim">Стрик</span><b>🔥 ${S.streak.n}</b></div>
      <div><span class="small dim">Ауралинги</span><b>${own}/${CREAT.length}</b></div><div><span class="small dim">Дропов</span><b>${S.drops}</b></div>
      <div><span class="small dim">Рекорд Rush</span><b>${S.best.rush}</b></div><div><span class="small dim">Дней в игре</span><b>${days}</b></div></div>
    <h3>Настройки</h3>
    <div class="q"><div class="grow">🔊 Звук</div><button class="tog ${S.set.sound?'on':''}" data-s="sound"></button></div>
    <div class="q"><div class="grow">📳 Вибрация</div><button class="tog ${S.set.haptic?'on':''}" data-s="haptic"></button></div>
    <div class="q"><input class="txt" id="nm" maxlength="18" value="${esc(S.name)}" placeholder="Никнейм"><button class="btn sm" id="nmS">OK</button></div>
    <button class="btn ghost wide" style="margin-top:16px;color:var(--red)" id="reset">Сбросить прогресс</button>
    <p class="center small dim" style="margin-top:12px">AURA v1.0 · сделано с 💜</p>`, {onClose:renderCur});
  s.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { const k = b.dataset.s; S.set[k] = !S.set[k]; b.classList.toggle('on', S.set[k]); save(); });
  s.querySelector('#nmS').onclick = () => { const v = s.querySelector('#nm').value.trim(); if (v){ S.name = v; save(); renderHeader(); toast('Ник обновлён ✏️'); } };
  s.querySelector('#reset').onclick = () => { if (confirm('Точно сбросить весь прогресс?')){ localStorage.removeItem(SAVE_KEY); location.reload(); } }; }

/* ---------------- ONBOARDING ---------------- */
function onboarding(){ const slides = [
    ['🔮','Фарми ауру','Тапай орб, прокачивайся и поднимайся от NPC до Абсолюта.'],
    ['📅','Каждый день — новый вайб','Цвет ауры дня, предсказание, квесты и стрик. Не теряй огонёк 🔥'],
    ['🎁','Собирай ауралингов','24 существа, 5 редкостей. Каждый новый — бонус к фарму навсегда.'],
    ['🏆','Рвись в Сигма-лигу','Еженедельные лиги, мини-игры и друзья. Погнали?']];
  let i = 0; const t = TG(); const tgName = t && t.initDataUnsafe && t.initDataUnsafe.user ? t.initDataUnsafe.user.first_name : '';
  const step = () => { const [e,h,p] = slides[i]; const last = i === slides.length-1;
    const s = openModal(`<div class="center" style="padding:10px 0"><div class="reveal">${e}</div><h2>${h}</h2><p class="dim" style="margin-bottom:18px">${p}</p>
      ${last?`<input class="txt" id="obN" maxlength="18" placeholder="Твой никнейм" value="${esc(tgName)}" style="margin-bottom:12px">`:''}
      <div class="row" style="justify-content:center;gap:6px;margin-bottom:16px">${slides.map((_,k)=>`<span style="width:${k===i?22:8}px;height:8px;border-radius:9px;background:${k===i?'var(--acc)':'var(--card2)'}"></span>`).join('')}</div>
      <button class="btn wide" id="obNext">${last?'Погнали 🚀':'Дальше'}</button></div>`, {lock:true});
    s.querySelector('#obNext').onclick = () => { if (!last){ i++; step(); return; }
      const n = s.querySelector('#obN').value.trim(); S.name = n || 'Аурик' + Math.floor(Math.random()*999); S.onboard = true;
      const g = earn(S.refBy ? 5000 : 1000, {raw:1}); closeModal(true); save(true); renderCur(); toast(`🎉 Стартовый бонус +${fmt(g)}${S.refBy?' (от друга)':''}`); jingle(); }; };
  step(); }

/* ---------------- LOOP & BOOT ---------------- */
function offline(){ const dt = (Date.now() - S.last) / 1000; if (dt < 5) return;
  S.energy = Math.min(maxE(), S.energy + dt * regen());
  const hrs = Math.min(dt/3600, CONFIG.OFFLINE_HOURS); const g = pph() * hrs;
  if (g >= 1){ const got = earn(g); setTimeout(()=>openModal(`<div class="center"><div class="reveal">🫶</div><h2>С возвращением!</h2>
    <p class="dim">Пока тебя не было, фан-клуб нафармил</p><p style="font-family:var(--head);font-size:34px;margin:10px 0">+${fmt(got)}</p>
    <p class="small dim">Оффлайн-доход копится до ${CONFIG.OFFLINE_HOURS} ч. Заходи чаще!</p><button class="btn wide" data-close style="margin-top:14px">Забрать</button></div>`, {onClose:renderCur}), 300); } }
function tick(){ const prevDay = S.daily && S.daily.day; ensureDaily(); if (S.daily.day !== prevDay){ renderCur(); toast('🌅 Новый день — новые квесты и вайб!'); }
  S.energy = Math.min(maxE(), S.energy + regen());
  if (pph()){ S.pacc += pph() / 3600; if (S.pacc >= 1){ const w = Math.floor(S.pacc); S.pacc -= w; earn(w); } }
  $('#hAura').textContent = fmt(S.aura); if (cur === 'farm') updateEnergy();
  if (pendingWeek && !$('#modal').classList.contains('open')) showWeek();
  save(); }
function showWeek(){ const w = pendingWeek; pendingWeek = null; if (w.prize) earn(w.prize, {raw:1});
  openModal(`<div class="center"><div class="reveal">${w.res==='up'?'🚀':w.res==='down'?'📉':'🏁'}</div><h2>Итоги недели</h2><p>Ты занял <b>#${w.place}</b> в лиге ${LEAGUES[w.from].n}</p>
    <p class="dim" style="margin:10px 0">${w.res==='up'?`Повышение! Добро пожаловать в ${LEAGUES[w.to].ic} ${LEAGUES[w.to].n}`:w.res==='down'?`Вылет в ${LEAGUES[w.to].n}. Отыграйся!`:'Остаёшься в лиге. Новая неделя — новый шанс.'}</p>
    ${w.prize?`<p>Награда: <b>+${fmt(w.prize)}</b> ✨</p>`:''}<button class="btn wide" data-close style="margin-top:14px">Погнали</button></div>`, {onClose:renderCur}); jingle(); }

function boot(){ const t = TG(); if (t){ try { t.ready(); t.expand(); t.setHeaderColor && t.setHeaderColor('#0b0614'); t.setBackgroundColor && t.setBackgroundColor('#0b0614'); t.disableVerticalSwipes && t.disableVerticalSwipes(); } catch(e){} }
  const saved = load(); S = saved || defState();
  if (!saved){ const p = new URLSearchParams(location.search); const sp = (t && t.initDataUnsafe && t.initDataUnsafe.start_param) || p.get('startapp') || p.get('ref') || '';
    if (sp) S.refBy = sp.replace(/^ref_/, ''); }
  if (S.week === undefined) S.week = weekIdx();
  ensureDaily(); applyAuraTheme(); offline(); renderCur();
  if (!S.onboard) onboarding();
  setInterval(tick, 1000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(true); else { offline(); renderCur(); } });
  addEventListener('pagehide', () => save(true)); }
boot();
</script>
</body>
