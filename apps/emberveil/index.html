<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c120b">
<meta name="description" content="ЭМБЕРВЕЙЛ — изометрическая фэнтези action-RPG: сражения, снаряжение, питомцы, бездна и восстановление последней деревни.">
<title>Эмбервейл</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Kurale&family=Ruslan+Display&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js" async></script>
<script>window.EVNET_BASE_URL = window.EVNET_BASE_URL_OVERRIDE || 'https://emberveil-api.emberveil.workers.dev';</script>
<style>
:root{
  --ink:#2b1a0e; --ink2:#5a3b22; --ink3:#8a6844;
  --parch:#ead7ae; --parch2:#d6bb86; --parchD:#b8945a;
  --wood:#3a2214; --wood2:#24140b; --woodL:#5b3820;
  --brass:#c9973f; --brassL:#f0cc78; --brassD:#7d5a20;
  --ox:#7c2418; --oxL:#a8382a; --oxD:#4a130c;
  --ember:#ff8a2b; --emberL:#ffc46b; --teal:#2f6e68;
  --r0:#d9ccae; --r1:#62a8e8; --r2:#b47cf0; --r3:#f2a634; --r4:#ff4c39;
  --disp:'Ruslan Display','Yeseva One',Georgia,'Times New Roman',serif;
  --sc:'Alegreya SC','Alegreya',Georgia,'Times New Roman',serif;
  --body:'Kurale','Philosopher',Georgia,'Times New Roman',serif;
  --sb:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px));
  --st:max(env(safe-area-inset-top,0px),calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)));
  --sl:max(env(safe-area-inset-left,0px),var(--tg-safe-area-inset-left,0px)); --sr:max(env(safe-area-inset-right,0px),var(--tg-safe-area-inset-right,0px));
  --k:1; --ak:1; --slot:64px;
  --ptex:none; --wtex:none; --ltex:none;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#140c07;color:var(--parch);font-family:var(--body);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;background:#140c07}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
.ico{width:1em;height:1em;display:inline-block;vertical-align:-.14em;fill:currentColor}

/* ===== shared surfaces ===== */
.parch{background:var(--ptex),radial-gradient(ellipse at 50% 40%,#f1e2bd 0%,#e2c993 70%,#c9a66a 100%);background-size:256px 256px,100% 100%;color:var(--ink);
  box-shadow:inset 0 0 0 1px rgba(80,45,15,.35),inset 0 0 38px rgba(110,62,20,.55),inset 0 0 6px rgba(70,35,10,.6)}
.woodframe{position:relative;border-radius:10px;padding:7px;background:var(--wtex),linear-gradient(160deg,#4f2f1a,#2b180c 60%,#3a2214);background-size:220px 220px,100% 100%;
  box-shadow:0 0 0 1px #120a05,inset 0 0 0 1px rgba(255,210,140,.18),inset 0 2px 0 rgba(255,220,160,.15),0 10px 26px rgba(0,0,0,.65)}
.woodframe>.inner{border-radius:5px;box-shadow:0 0 0 2px var(--brassD),0 0 0 3px var(--brass),0 0 0 4px #1b0f07}
.stud{position:absolute;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff1c0,#d9a648 35%,#7a5216 75%,#3a2408);box-shadow:0 1px 2px rgba(0,0,0,.7);z-index:3}
.stud.tl{left:-3px;top:-3px}.stud.tr{right:-3px;top:-3px}.stud.bl{left:-3px;bottom:-3px}.stud.br{right:-3px;bottom:-3px}
.leather{background:var(--ltex),linear-gradient(180deg,#8f3324,#6b2117 55%,#561a11);background-size:180px 180px,100% 100%;color:#f6e3bd;border-radius:7px;
  box-shadow:inset 0 1px 0 rgba(255,200,170,.25),inset 0 -2px 0 rgba(0,0,0,.35),0 3px 0 #2c0b06,0 5px 10px rgba(0,0,0,.5);position:relative}
.leather::after{content:"";position:absolute;inset:4px;border:1.5px dashed rgba(255,222,170,.45);border-radius:4px;pointer-events:none}
.btn{font-family:var(--sc);font-weight:700;font-size:17px;letter-spacing:.04em;padding:12px 20px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-shadow:0 1px 0 rgba(0,0,0,.5);transition:transform .08s,filter .15s}
.btn:active{transform:translateY(2px) scale(.98);filter:brightness(1.12)}
.btn.brassb{background:linear-gradient(180deg,#f3d58c,#c9973f 45%,#93681f);color:#2b1606;text-shadow:0 1px 0 rgba(255,240,200,.6);box-shadow:inset 0 1px 0 #fff3c9,inset 0 -2px 0 rgba(0,0,0,.25),0 3px 0 #4e3309,0 5px 10px rgba(0,0,0,.5)}
.btn.brassb::after{border-color:rgba(70,40,5,.45)}
.btn.woodb{background:var(--wtex),linear-gradient(180deg,#5d3a20,#3a2213);background-size:200px,100%;color:#f0d9aa;box-shadow:inset 0 1px 0 rgba(255,220,170,.2),0 3px 0 #170c05,0 5px 10px rgba(0,0,0,.5)}
.btn.dis,.btn:disabled{filter:grayscale(.85) brightness(.75);pointer-events:none}
.btn.small{font-size:14px;padding:7px 12px;min-height:38px}
.seal{width:78px;height:78px;border-radius:47% 53% 50% 50%/52% 48% 52% 48%;background:radial-gradient(circle at 40% 35%,#d0503a,#9a2a1b 45%,#5e140c 85%);
  box-shadow:inset 0 -4px 6px rgba(0,0,0,.45),inset 0 3px 4px rgba(255,170,150,.35),0 4px 8px rgba(0,0,0,.55);display:grid;place-items:center;color:#ffd9c0;font-family:var(--disp);font-size:13px}
h1,h2,h3{font-weight:400}
.dcap::first-letter{font-family:var(--disp);float:left;font-size:2.6em;line-height:.9;margin:2px 6px 0 0;color:var(--ox);text-shadow:1px 1px 0 var(--brass)}
.rule{height:12px;margin:6px 0;background:radial-gradient(circle,var(--ink2) 2.5px,transparent 3px) center/12px 12px no-repeat,linear-gradient(90deg,transparent,var(--ink3) 15%,var(--ink3) 85%,transparent) center/100% 1px no-repeat}
.r0{color:#8b7a58}.r1{color:#2c74b8}.r2{color:#7b3cbf}.r3{color:#b86b00}.r4{color:#c8281a}
.bg-r0{--rc:var(--r0)}.bg-r1{--rc:var(--r1)}.bg-r2{--rc:var(--r2)}.bg-r3{--rc:var(--r3)}.bg-r4{--rc:var(--r4)}

/* ===== loading ===== */
#load{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:radial-gradient(ellipse at 50% 60%,#3a1d0c 0%,#1a0e07 55%,#0b0603 100%);transition:opacity .7s}
#load .logo{font-family:var(--disp);font-size:clamp(38px,11vw,72px);letter-spacing:.06em;color:#ffcf8a;
  text-shadow:0 0 18px rgba(255,120,40,.65),0 2px 0 #7a2c0c,0 4px 0 #3b1306}
#load .sub{font-family:var(--sc);letter-spacing:.3em;color:#c9a46a;font-size:13px;margin-top:-14px}
#loadBar{width:min(260px,70vw);height:12px;border-radius:7px;background:#2a170b;box-shadow:0 0 0 2px var(--brassD),0 0 0 3px #120903,inset 0 2px 4px rgba(0,0,0,.6);overflow:hidden}
#loadBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff5a1a,#ffb347,#fff0b0);box-shadow:0 0 10px #ff8a2b;transition:width .25s}
#loadMsg{font-family:var(--body);color:#b9976a;font-size:15px;min-height:20px;text-align:center;padding:0 24px;max-width:460px;line-height:1.4}
#loadMsg.err{color:#ffb4a0;background:rgba(80,15,8,.6);border:1px solid #a8382a;border-radius:8px;padding:14px 18px}
.emb{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffb04a;box-shadow:0 0 6px #ff7a1a;animation:rise 4s linear infinite;opacity:0}
@keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:1}100%{transform:translateY(-60vh) translateX(30px);opacity:0}}

/* ===== title ===== */
#title{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(var(--st) + 7vh) 20px calc(var(--sb) + 5vh);pointer-events:none}
#title>*{pointer-events:auto}
#title .tlogo{text-align:center}
#title .tlogo h1{font-family:var(--disp);font-size:clamp(42px,12.5vw,86px);line-height:1;letter-spacing:.05em;color:#ffd79a;
  text-shadow:0 0 24px rgba(255,110,30,.7),0 2px 0 #8a3510,0 4px 0 #4a1a07,0 8px 18px rgba(0,0,0,.8)}
#title .tlogo p{font-family:var(--sc);font-weight:700;color:#f3dcb0;letter-spacing:.32em;font-size:13px;margin-top:10px;text-shadow:0 2px 6px #000}
#title .tlogo .orn{width:220px;height:18px;margin:10px auto 0;opacity:.9}
#tMenu{display:flex;flex-direction:column;gap:12px;width:min(300px,82vw)}
#tMenu .btn{width:100%}
#tFoot{font-family:var(--sc);font-size:11px;color:rgba(240,215,170,.55);letter-spacing:.2em;margin-top:12px;text-align:center}

/* ===== HUD ===== */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
#hud .pe{pointer-events:auto}
#hTop{position:absolute;top:calc(var(--st) + 8px);left:calc(var(--sl) + 8px);right:calc(var(--sr) + 8px);display:flex;gap:8px;align-items:flex-start}
#hPort{width:62px;height:62px;flex:0 0 62px;border-radius:50%;position:relative;background:radial-gradient(circle at 50% 40%,#5b3a22,#20120a);
  box-shadow:0 0 0 3px var(--brass),0 0 0 5px #24140a,0 4px 10px rgba(0,0,0,.6);overflow:visible}
#hPort img{width:100%;height:100%;border-radius:50%;display:block}
#hLvl{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font-family:var(--sc);font-weight:800;font-size:13px;color:#2b1606;
  background:linear-gradient(180deg,#f6dc98,#c9973f);border-radius:9px;padding:0 7px;box-shadow:0 0 0 1.5px #3b2408,0 2px 3px rgba(0,0,0,.5);white-space:nowrap}
#hBars{flex:1;display:flex;flex-direction:column;gap:5px;padding-top:6px;max-width:230px}
.bar{height:16px;border-radius:8px;position:relative;background:#1d0f08;box-shadow:0 0 0 2px #6e4a1a,0 0 0 3px #150a04,inset 0 2px 4px rgba(0,0,0,.7);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;transform-origin:left;transition:transform .12s}
.bar i.lag{background:#f3e3c0;opacity:.55;transition:transform .6s .25s}
.bar.hp i.v{background:linear-gradient(180deg,#ff7a62,#c42a1c 50%,#7e140c)}
.bar.em{height:10px}.bar.em i.v{background:linear-gradient(180deg,#ffe08a,#ff8a2b 50%,#b64a0c)}
.bar.em.full{box-shadow:0 0 0 2px #ffc46b,0 0 0 3px #150a04,0 0 12px #ff8a2b}
.bar.xp{height:6px;box-shadow:0 0 0 1.5px #5b3d16}.bar.xp i.v{background:linear-gradient(90deg,#9ad1c8,#e6f5d0)}
.bar b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--sc);font-weight:800;font-size:11px;color:#fff3dc;text-shadow:0 1px 1px #000,0 0 3px #000}
#hRight{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-left:auto}
.hbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:#f3dcb0;
  background:radial-gradient(circle at 40% 35%,#5b3a22,#2a170b);box-shadow:0 0 0 2px var(--brass),0 0 0 3.5px #1a0d05,0 3px 6px rgba(0,0,0,.55)}
.hbtn:active{transform:scale(.94)}
#hRes{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:210px}
.rchip{font-family:var(--sc);font-weight:700;font-size:12px;display:inline-flex;align-items:center;gap:3px;padding:2px 7px 2px 4px;border-radius:10px;
  background:rgba(30,16,8,.78);box-shadow:0 0 0 1px rgba(201,151,63,.55);color:#f3dcb0}
.rchip .ico{font-size:14px}
#hQuest{position:absolute;top:calc(var(--st) + 84px);left:calc(var(--sl) + 8px);width:min(210px,54vw);padding:7px 10px 8px;border-radius:3px 9px 6px 2px;
  transform:rotate(-.6deg);font-size:12.5px;line-height:1.3;pointer-events:auto}
#hQuest h4{font-family:var(--sc);font-weight:800;font-size:11px;letter-spacing:.12em;color:var(--ox);margin-bottom:2px}
#hQuest .q{margin-top:3px}
#hQuest .q b{font-family:var(--sc);font-weight:700}
#hQuest .q.done{color:#3f6b2a}
#hBoss{position:absolute;top:calc(var(--st) + 84px);left:50%;transform:translateX(-50%);width:min(340px,88vw);text-align:center}
#hBoss .bn{font-family:var(--disp);font-size:17px;color:#ffd3a0;text-shadow:0 2px 0 #000,0 0 10px #a32;margin-bottom:4px}
#hBoss .bar{height:14px}
#hBoss .bar i.v{background:linear-gradient(180deg,#d65cff,#7b1fa8 55%,#3f0a5c)}
#hBoss .ph{display:flex;gap:4px;justify-content:center;margin-top:4px}
#hBoss .ph i{width:8px;height:8px;transform:rotate(45deg);background:#ffcf8a;box-shadow:0 0 6px #ff8a2b}
#hBoss .ph i.off{background:#4a2c18;box-shadow:none}
#hObj{position:absolute;top:calc(var(--st) + 80px);right:calc(var(--sr) + 8px);font-family:var(--sc);font-weight:700;font-size:13px;color:#f6e3bd;
  text-align:right;text-shadow:0 1px 2px #000,0 0 6px #000;max-width:46vw}
#hObj small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:#d8c094}
#joy{position:absolute;width:150px;height:150px;left:calc(var(--sl) + 18px);bottom:calc(var(--sb) + 24px);border-radius:50%;pointer-events:none;opacity:.0;transition:opacity .2s}
#joy.on{opacity:1}
#joy .ring{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(30,16,8,.25) 55%,rgba(30,16,8,.55) 70%,transparent 71%);
  box-shadow:inset 0 0 0 3px rgba(201,151,63,.75),inset 0 0 0 6px rgba(26,13,5,.6)}
#joy .knob{position:absolute;width:62px;height:62px;left:44px;top:44px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f6dc98,#c9973f 45%,#6b4512);
  box-shadow:0 0 0 2px #2a170b,0 4px 8px rgba(0,0,0,.6)}
#joy .knob::after{content:"";position:absolute;inset:14px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(60,35,8,.6)}
#joyHint{position:absolute;left:calc(var(--sl) + 30px);bottom:calc(var(--sb) + 60px);font-family:var(--sc);font-size:12px;color:rgba(246,227,189,.55);letter-spacing:.15em}
#acts{position:absolute;right:calc(var(--sr) + 14px);bottom:calc(var(--sb) + 18px);width:210px;height:220px}
#acts.left{right:auto;left:calc(var(--sl) + 14px)}
.ab{position:absolute;border-radius:50%;display:grid;place-items:center;pointer-events:auto;touch-action:none}
.ab .ic{position:relative;z-index:2;display:grid;place-items:center}
.ab .cd{position:absolute;inset:0;border-radius:50%;z-index:3;pointer-events:none;background:conic-gradient(rgba(15,8,3,.78) var(--p,0%),transparent 0)}
.ab .cdt{position:absolute;z-index:4;font-family:var(--sc);font-weight:800;color:#fff;font-size:15px;text-shadow:0 1px 2px #000}
.ab .rk{position:absolute;z-index:4;bottom:-4px;right:-2px;font-family:var(--sc);font-weight:800;font-size:10px;color:#2b1606;background:#e8c87a;border-radius:6px;padding:0 4px;box-shadow:0 0 0 1px #3b2408}
#bAtk{width:96px;height:96px;right:0;bottom:0;background:radial-gradient(circle at 42% 35%,#7a4a26,#3a2010 60%,#1c0f06);
  box-shadow:0 0 0 4px var(--brass),0 0 0 7px #1c0f06,0 0 0 8px rgba(201,151,63,.4),0 6px 14px rgba(0,0,0,.6);color:#ffe2a8;font-size:44px}
#bAtk.talk{background:radial-gradient(circle at 42% 35%,#d0503a,#9a2a1b 45%,#5e140c 85%);font-size:13px}
#bAtk .lbl{font-family:var(--sc);font-weight:800;font-size:13px;letter-spacing:.06em}
.ab.sk{width:60px;height:60px;background:radial-gradient(circle at 42% 35%,#4e5a5a,#262c2c 60%,#121515);
  box-shadow:0 0 0 3px var(--brass),0 0 0 5px #1c0f06,0 4px 8px rgba(0,0,0,.55);color:#f3e2bc;font-size:28px}
.ab.sk.lock{filter:grayscale(1) brightness(.5)}
#bS1{right:104px;bottom:8px}#bS2{right:92px;bottom:80px}#bS3{right:28px;bottom:112px}
#bUlt{width:58px;height:58px;right:146px;bottom:132px;background:radial-gradient(circle at 42% 35%,#7a3412,#3a1508);box-shadow:0 0 0 3px #c9973f,0 0 0 5px #1c0f06;color:#ffcf8a;font-size:28px;transition:box-shadow .2s}
#bUlt.ready{box-shadow:0 0 0 3px #ffd27a,0 0 0 5px #1c0f06,0 0 22px 6px rgba(255,138,43,.85);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
#bDodge{width:54px;height:54px;right:-6px;bottom:178px;background:radial-gradient(circle at 42% 35%,#5a4a2c,#2a2010);box-shadow:0 0 0 3px #a8834a,0 0 0 5px #1c0f06;color:#f3dcb0;font-size:26px}
#bPot{width:52px;height:52px;left:-112px;bottom:4px;background:radial-gradient(circle at 42% 35%,#5b1f1a,#2a0d0a);box-shadow:0 0 0 3px #a8834a,0 0 0 5px #1c0f06;color:#ff9a8a;font-size:24px}
#bBomb{width:46px;height:46px;left:-58px;bottom:66px;background:radial-gradient(circle at 42% 35%,#3b3b44,#16161c);box-shadow:0 0 0 3px #a8834a,0 0 0 5px #1c0f06;color:#ffcf8a;font-size:20px}
#acts.left #bPot{left:auto;right:-112px}#acts.left #bBomb{left:auto;right:-58px}
.ab .cnt{position:absolute;z-index:4;top:-4px;right:-4px;font-family:var(--sc);font-weight:800;font-size:11px;background:#f3dcb0;color:#2b1606;border-radius:7px;padding:0 4px;box-shadow:0 0 0 1px #3b2408}
#hMenu{position:absolute;left:calc(var(--sl) + 8px);bottom:calc(var(--sb) + 196px);display:flex;flex-direction:column;gap:9px}
#hMenu .hbtn{width:50px;height:50px;font-size:24px;position:relative}
#hMenu .hbtn .dot{position:absolute;top:0;right:0;width:12px;height:12px;border-radius:50%;background:#e8432c;box-shadow:0 0 0 2px #2a170b,0 0 6px #ff6a3a}
#hMenu .hbtn span.t{position:absolute;left:58px;font-family:var(--sc);font-weight:700;font-size:12px;color:#f6e3bd;text-shadow:0 1px 2px #000,0 0 4px #000;white-space:nowrap;opacity:.9}
#prompt{position:absolute;left:50%;bottom:calc(var(--sb) + 250px);transform:translateX(-50%);font-family:var(--sc);font-weight:700;font-size:14px;color:#2b1606;
  padding:6px 14px;border-radius:14px;background:linear-gradient(180deg,#f6e3bd,#d6bb86);box-shadow:0 0 0 2px #5b3d16,0 4px 8px rgba(0,0,0,.5);white-space:nowrap;pointer-events:auto}
#banner{position:absolute;left:0;right:0;top:32%;text-align:center;pointer-events:none;opacity:0;transition:opacity .4s}
#banner.on{opacity:1}
#banner h2{font-family:var(--disp);font-size:clamp(22px,7.2vw,54px);padding:0 10px;line-height:1.1;color:#ffd79a;text-shadow:0 0 18px rgba(255,100,30,.8),0 3px 0 #4a1a07}
#banner p{font-family:var(--sc);font-weight:700;letter-spacing:.25em;color:#f6e3bd;font-size:14px;text-shadow:0 2px 4px #000;margin-top:6px}
#vign{position:fixed;inset:0;pointer-events:none;z-index:6;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(10,4,2,.55) 100%)}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:7;opacity:0;background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(160,10,0,.65) 100%);transition:opacity .25s}

/* damage numbers */
#dmg{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.dn{position:absolute;left:0;top:0;font-family:var(--sc);font-weight:800;font-size:17px;color:#fff6e0;white-space:nowrap;will-change:transform,opacity;
  -webkit-text-stroke:3px #2a1206;paint-order:stroke fill;text-shadow:0 2px 2px rgba(0,0,0,.5)}
.dn.crit{font-family:var(--disp);font-size:26px;color:#ffcf4a;-webkit-text-stroke:4px #5a1800}
.dn.pl{color:#ff6a5a}.dn.heal{color:#8dff9a}.dn.fire{color:#ff9a3a}.dn.ice{color:#9fe2ff}.dn.poison{color:#b6f25a}.dn.light{color:#f7f08a}
.dn.water{color:#7ac8ff}.dn.txt{font-size:14px;color:#f3dcb0}.dn.gold{color:#ffd34a;font-size:14px}

/* toasts */
#toasts{position:fixed;left:50%;top:calc(var(--st) + 168px);transform:translateX(-50%);z-index:29;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:92vw}
.toast{font-family:var(--body);font-size:14px;padding:8px 14px 8px 12px;border-radius:4px 10px 4px 10px;max-width:340px;display:flex;align-items:center;gap:9px;
  animation:tin .3s ease-out,tout .4s ease-in forwards;animation-delay:0s,var(--d,2.6s)}
.toast .ti{width:30px;height:30px;flex:0 0 30px;border-radius:5px;background:#2a170b center/contain no-repeat;box-shadow:0 0 0 1.5px var(--rc,#c9973f)}
.toast b{font-family:var(--sc);font-weight:800}
@keyframes tin{from{transform:translateY(-14px) scale(.96);opacity:0}}
@keyframes tout{to{transform:translateY(-10px);opacity:0}}

/* ===== dialog ===== */
#dlg{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:0 10px calc(var(--sb) + 12px);display:flex;flex-direction:column;align-items:center}
#dlgBack{position:fixed;inset:0;z-index:39;background:linear-gradient(0deg,rgba(10,5,2,.75),transparent 60%)}
#dlgBox{width:min(560px,100%);position:relative;margin-top:70px}
#dlgPort{position:absolute;left:10px;top:-104px;width:118px;height:118px;border-radius:8px;background:#2a170b;box-shadow:0 0 0 3px var(--brass),0 0 0 6px #1c0f06,0 6px 14px rgba(0,0,0,.6);overflow:hidden;z-index:2}
#dlgPort img{width:100%;height:100%;display:block}
#dlgPort.right{left:auto;right:10px}
#dlgName{position:absolute;left:140px;top:-36px;font-family:var(--disp);font-size:20px;color:#ffd79a;text-shadow:0 2px 0 #000,0 0 8px rgba(0,0,0,.8);z-index:2}
#dlgName small{display:block;font-family:var(--sc);font-weight:700;font-size:11px;letter-spacing:.2em;color:#d8b77a}
#dlgPort.right~#dlgName{left:auto;right:140px;text-align:right}
#dlgText{min-height:120px;padding:18px 18px 30px;font-size:16.5px;line-height:1.45;border-radius:4px}
#dlgText em{color:var(--ox);font-style:normal;font-weight:bold}
#dlgNext{position:absolute;right:16px;bottom:8px;font-family:var(--sc);font-weight:700;font-size:12px;color:var(--ink2);animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
#dlgSkip{position:fixed;top:calc(var(--st) + 12px);right:calc(var(--sr) + 12px);z-index:41}
#dlgChoices{display:flex;flex-direction:column;gap:8px;margin-top:10px;width:min(560px,100%)}

/* story slides */
#story{position:fixed;inset:0;z-index:45;display:flex;align-items:flex-end;justify-content:center;padding:0 16px calc(var(--sb) + 40px);
  background:linear-gradient(0deg,rgba(12,6,3,.95) 0%,rgba(12,6,3,.6) 45%,rgba(12,6,3,.1) 75%)}
#storyCard{width:min(520px,100%);text-align:center}
#storyCard h2{font-family:var(--disp);font-size:26px;color:#ffcf8a;text-shadow:0 0 14px rgba(255,100,30,.6),0 2px 0 #000;margin-bottom:12px}
#storyCard p{font-family:var(--body);font-size:17.5px;line-height:1.55;color:#f1dfba;text-shadow:0 2px 4px #000;min-height:150px}
#storyCard .tap{font-family:var(--sc);font-size:12px;letter-spacing:.25em;color:#b9976a;margin-top:16px;animation:bob 1.2s infinite}

/* ===== panels (book) ===== */
#panel{position:fixed;inset:0;z-index:30;display:flex;align-items:stretch;justify-content:center;padding:calc(var(--st) + 8px) calc(var(--sr) + 6px) calc(var(--sb) + 8px) calc(var(--sl) + 6px);background:rgba(8,4,2,.6)}
#pFrame{width:min(620px,100%);display:flex;flex-direction:column}
#pFrame>.woodframe{flex:1;display:flex;flex-direction:column;min-height:0}
#pFrame>.woodframe>.inner{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
#pHead{display:flex;align-items:center;gap:8px;padding:8px 10px 6px;border-bottom:1px solid rgba(90,59,34,.35)}
#pHead h2{flex:1;font-family:var(--disp);font-size:22px;color:var(--ox);text-shadow:1px 1px 0 rgba(201,151,63,.5);line-height:1.1}
#pHead h2 small{display:block;font-family:var(--body);font-size:12.5px;color:var(--ink2)}
#pClose{width:44px;height:44px;flex:0 0 44px;font-size:22px}
#pTabs{display:flex;gap:4px;padding:6px 8px 0;overflow-x:auto;scrollbar-width:none}
#pTabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--sc);font-weight:700;font-size:13px;padding:8px 10px 9px;border-radius:8px 8px 0 0;color:#f0d9aa;white-space:nowrap;
  background:linear-gradient(180deg,#5d3a20,#3a2213);box-shadow:inset 0 1px 0 rgba(255,220,170,.2);display:flex;align-items:center;gap:5px}
.tab.on{background:linear-gradient(180deg,#a8382a,#7c2418);color:#fff0d0}
#pBody{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 12px 18px;-webkit-overflow-scrolling:touch;touch-action:pan-y;font-size:14.5px;line-height:1.4}
#pBody::-webkit-scrollbar{width:6px}#pBody::-webkit-scrollbar-thumb{background:rgba(90,59,34,.5);border-radius:3px}
.sect{font-family:var(--sc);font-weight:800;font-size:13px;letter-spacing:.14em;color:var(--ox);margin:12px 0 6px;display:flex;align-items:center;gap:8px}
.sect::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--ink3),transparent)}
.muted{color:var(--ink2);font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
.costs{display:flex;gap:6px;flex-wrap:wrap}
.cost{font-family:var(--sc);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:2px}
.cost.no{color:#b3261a}
.card{border-radius:6px;padding:9px;margin-bottom:8px;background:rgba(255,248,225,.35);box-shadow:inset 0 0 0 1px rgba(90,59,34,.3),0 1px 0 rgba(255,255,255,.4)}
.card h4{font-family:var(--sc);font-weight:800;font-size:15px;color:var(--ink)}
.pill{font-family:var(--sc);font-weight:700;font-size:11px;padding:1px 7px;border-radius:8px;background:rgba(90,59,34,.15);color:var(--ink2)}

/* paperdoll & inventory */
#doll{display:grid;grid-template-columns:64px 1fr 64px;grid-template-rows:repeat(4,64px);gap:7px;position:relative}
#dollCenter{grid-column:2;grid-row:1/span 4;border-radius:8px;background:radial-gradient(ellipse at 50% 70%,#6b4a2c,#2a170b);box-shadow:inset 0 0 0 2px rgba(201,151,63,.6),inset 0 0 20px rgba(0,0,0,.6);position:relative;overflow:hidden;min-height:180px}
#dollCenter img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#dollPow{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-family:var(--sc);font-weight:800;color:#ffd79a;font-size:13px;text-shadow:0 1px 2px #000}
.slot{aspect-ratio:1;border-radius:7px;position:relative;background:radial-gradient(circle at 50% 40%,#4b3220,#24150b);
  box-shadow:inset 0 0 0 2px var(--rc,#6e4a1a),inset 0 0 12px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.3);overflow:hidden;cursor:pointer}
.slot img{position:absolute;inset:6%;width:88%;height:88%;object-fit:contain}
.slot .ph{position:absolute;inset:0;display:grid;place-items:center;color:rgba(240,210,160,.25);font-size:28px}
.slot .lv{position:absolute;right:3px;bottom:1px;font-family:var(--sc);font-weight:800;font-size:10px;color:#f3dcb0;text-shadow:0 1px 1px #000}
.slot .up{position:absolute;left:3px;top:1px;font-family:var(--sc);font-weight:800;font-size:10px;color:#9be37a;text-shadow:0 1px 1px #000}
.slot .nw{position:absolute;left:3px;top:3px;width:7px;height:7px;border-radius:50%;background:#ff7a3a;box-shadow:0 0 5px #ff7a3a}
.slot .lk{position:absolute;right:3px;top:2px;font-size:11px;color:#f3dcb0}
.slot .eq{position:absolute;left:2px;bottom:1px;font-family:var(--sc);font-size:9px;color:#9be37a}
.slot.sel{box-shadow:inset 0 0 0 2px var(--rc,#6e4a1a),0 0 0 2px #ffcf8a,0 0 10px #ff8a2b}
.slot.r4,.slot.r3{animation:glow 2.4s infinite}
@keyframes glow{50%{box-shadow:inset 0 0 0 2px var(--rc),inset 0 0 16px var(--rc),0 1px 0 rgba(255,255,255,.3)}}
#invGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px}
#itemTip{margin-top:10px}
.tipc{border-radius:6px;padding:10px;background:rgba(40,22,10,.92);color:#f1dfba;box-shadow:inset 0 0 0 2px var(--rc,#6e4a1a)}
.tipc h4{font-family:var(--disp);font-size:17px;color:var(--rc)}
.tipc .ty{font-family:var(--sc);font-size:12px;color:#c9ad7a}
.tipc .pw{font-family:var(--sc);font-weight:800;font-size:14px;color:#ffd79a}
.tipc ul{list-style:none;margin:6px 0}
.tipc li{font-size:13.5px;padding:1px 0}
.tipc li.af{color:#a9d8ff}.tipc li.el{color:#ffb070}.tipc li.set{color:#9be37a}.tipc li.setoff{color:#7d7060}.tipc li.uni{color:#ffcf8a;font-style:italic}
.tipc .cmp{font-family:var(--sc);font-weight:700;font-size:12px}
.up1{color:#7ee36a}.dn1{color:#ff7a62}
.tipc .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sockrow{display:flex;gap:5px;margin:4px 0}
.sock{width:22px;height:22px;border-radius:50%;background:#140b05;box-shadow:inset 0 0 0 2px #6e4a1a;display:grid;place-items:center}
.sock i{width:13px;height:13px;transform:rotate(45deg);border-radius:2px}

/* talents */
.tree{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tnode{border-radius:8px;padding:8px 6px;text-align:center;position:relative;background:rgba(255,248,225,.35);box-shadow:inset 0 0 0 1px rgba(90,59,34,.35)}
.tnode .ti{width:52px;height:52px;margin:0 auto 4px;border-radius:50%;display:grid;place-items:center;font-size:28px;color:#f3e2bc;
  background:radial-gradient(circle at 42% 35%,#4e5a5a,#262c2c 60%,#121515);box-shadow:0 0 0 3px var(--brass),0 0 0 4px #1c0f06}
.tnode.lock .ti{filter:grayscale(1) brightness(.55)}
.tnode h5{font-family:var(--sc);font-weight:800;font-size:12.5px;color:var(--ink);line-height:1.15}
.tnode .rk{font-family:var(--sc);font-weight:800;font-size:12px;color:var(--ox)}
.tnode p{font-size:11.5px;color:var(--ink2);line-height:1.25;margin:3px 0 5px}
.tnode .btn{padding:4px 8px;min-height:32px;font-size:13px}
.tnode .btn:disabled{filter:none;opacity:.35}

/* map */
#map{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;background:#1a0f08}
#mapHead{display:flex;align-items:center;gap:8px;padding:calc(var(--st) + 8px) 10px 6px}
#mapHead h2{flex:1;font-family:var(--disp);color:#ffd79a;font-size:22px;text-shadow:0 2px 0 #000}
#mapScroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#mapCv{display:block;width:100%}
#mapNodes{position:absolute;left:0;top:0;width:100%}
.mnode{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;display:grid;place-items:center;font-family:var(--sc);font-weight:800;font-size:15px;color:#2b1606;
  background:radial-gradient(circle at 40% 35%,#fff0c0,#d9a648 50%,#8a5d1a);box-shadow:0 0 0 2px #3b2408,0 3px 6px rgba(0,0,0,.55)}
.mnode.boss{width:58px;height:58px;margin:-29px 0 0 -29px;background:radial-gradient(circle at 40% 35%,#ff9a7a,#b2301e 50%,#5e140c);color:#ffe2c8;font-size:22px}
.mnode.lock{filter:grayscale(1) brightness(.5);pointer-events:none}
.mnode.cur{animation:pulse 1.1s infinite;box-shadow:0 0 0 2px #3b2408,0 0 0 5px rgba(255,200,120,.6),0 0 18px #ff8a2b}
.mnode .st{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;color:#ffcf4a;text-shadow:0 1px 1px #000;letter-spacing:-1px}
.mnode .st i{color:#5b4a36;font-style:normal}
.mzone{position:absolute;left:12px;font-family:var(--disp);font-size:19px;color:#2b1a0e;text-shadow:0 1px 0 rgba(255,240,200,.6)}
.mzone small{display:block;font-family:var(--sc);font-weight:700;font-size:11px;color:#5a3b22;letter-spacing:.12em}
#stageCard{position:fixed;left:0;right:0;bottom:0;z-index:26;padding:0 10px calc(var(--sb) + 10px);display:flex;justify-content:center}
#stageCard .woodframe{width:min(520px,100%)}
#stageCard .inner{padding:12px 14px}
#stageCard h3{font-family:var(--disp);font-size:21px;color:var(--ox)}

/* results */
#res{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(8,4,2,.72)}
#res .woodframe{width:min(440px,100%)}
#res .inner{padding:16px;text-align:center}
#res h2{font-family:var(--disp);font-size:30px;color:var(--ox)}
.stars{display:flex;justify-content:center;gap:10px;margin:10px 0}
.star{width:46px;height:46px;color:#5b4a36;font-size:46px;line-height:1;transform:scale(.4);opacity:0;transition:all .35s cubic-bezier(.3,1.8,.5,1)}
.star.on{color:#ffc93a;filter:drop-shadow(0 0 6px #ff9a1a)}
.star.show{transform:scale(1);opacity:1}
.lootrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.lootrow .slot{width:52px}

/* boons */
#boons{position:fixed;inset:0;z-index:36;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;background:rgba(8,4,2,.78)}
#boons h2{font-family:var(--disp);color:#ffd79a;font-size:26px;text-shadow:0 2px 0 #000}
.boon{width:min(380px,100%);display:flex;gap:12px;align-items:center;text-align:left;padding:12px;border-radius:8px}
.boon .bi{width:54px;height:54px;flex:0 0 54px;border-radius:50%;display:grid;place-items:center;font-size:28px;color:#ffe2a8;background:radial-gradient(circle at 42% 35%,#7a3412,#3a1508);box-shadow:0 0 0 3px var(--brass)}
.boon h4{font-family:var(--sc);font-weight:800;font-size:16px}
.boon p{font-size:13.5px;color:var(--ink2)}

/* settings */
.set{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed rgba(90,59,34,.3)}
.set label{flex:1;font-family:var(--sc);font-weight:700}
.set input[type=range]{width:46%;accent-color:#7c2418}
.seg{display:flex;border-radius:7px;overflow:hidden;box-shadow:0 0 0 1.5px var(--ink3)}
.seg button{font-family:var(--sc);font-weight:700;font-size:13px;padding:7px 10px;color:var(--ink2)}
.seg button.on{background:#7c2418;color:#fff0d0}

#fade{position:fixed;inset:0;z-index:90;background:#0b0603;opacity:0;pointer-events:none;transition:opacity .35s}
#fadeMsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-family:var(--sc);color:#e8c48a;letter-spacing:.12em;font-size:14px}
#fadeMsg i{display:block;width:180px;height:6px;margin:10px auto 0;border-radius:4px;background:#2a170b;box-shadow:0 0 0 1.5px var(--brassD);overflow:hidden}
#fadeMsg u{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff5a1a,#ffb347);transition:width .2s}
#fade.on{opacity:1;pointer-events:auto}
/* ===== shared helpers (new systems) ===== */
.cols2>div{min-width:0}
.grid2{display:block}
.hpill{font-family:var(--sc);font-weight:800;font-size:11px;padding:1px 7px;border-radius:8px;background:#7c2418;color:#fff0d0}
.prog{height:8px;border-radius:4px;background:rgba(60,35,15,.25);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(90,59,34,.3)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#c9973f,#ffcf8a)}
.prog.ok i{background:linear-gradient(90deg,#3f7a2a,#9be37a)}.prog.bad i{background:linear-gradient(90deg,#7c2418,#e8432c)}
.chip2{display:inline-flex;align-items:center;gap:4px;font-family:var(--sc);font-weight:700;font-size:12px;padding:2px 8px;border-radius:9px;background:rgba(90,59,34,.15);color:var(--ink)}
.port{width:64px;height:64px;flex:0 0 64px;border-radius:8px;background:radial-gradient(circle,#6b4a2c,#2a170b);box-shadow:0 0 0 2px var(--rc,#c9973f);object-fit:cover}
.synrow{display:flex;gap:10px;align-items:flex-start}
.synic{width:46px;height:46px;flex:0 0 46px;border-radius:50%;display:grid;place-items:center;font-size:24px;color:#fff3dc;box-shadow:0 0 0 2px var(--brass),0 0 0 3.5px #1c0f06}
.syn-new{animation:glow 1.6s infinite}
.dn.syn{font-family:var(--disp);font-size:24px;color:#fff3c0;-webkit-text-stroke:4px #3a0f40;letter-spacing:.04em}
.dn.syn.s_shatter{color:#bff4ff;-webkit-text-stroke-color:#0d3a5a}.dn.syn.s_toxic{color:#d6ff7a;-webkit-text-stroke-color:#26420a}.dn.syn.s_conduct{color:#fff98a;-webkit-text-stroke-color:#3a3a00}
.dn.syn.s_steam{color:#f0f6ff;-webkit-text-stroke-color:#3a4a5a}.dn.syn.s_oil{color:#ffb04a;-webkit-text-stroke-color:#4a1000}.dn.syn.s_flash{color:#9fe8ff;-webkit-text-stroke-color:#102a4a}.dn.syn.s_plasma{color:#ffd0ff;-webkit-text-stroke-color:#3a0a3a}
.dn.wet{color:#7ac8ff;font-size:13px}.dn.tag{font-size:13px;color:#ffe9b0}
/* world-anchored labels (sockets, ally tags, puzzle hints) */
#wlbl{position:fixed;inset:0;pointer-events:none;z-index:11;overflow:hidden}
.wl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;font-family:var(--sc);font-weight:800;font-size:13px;color:#fff3dc;text-shadow:0 1px 2px #000,0 0 4px #000;will-change:transform}
.wl.rn{font-family:var(--disp);font-size:22px;color:#ffd79a}
.wl.ally{font-size:11px;color:#bfe9ff}
.sock3{pointer-events:auto;width:calc(42px*var(--k));height:calc(42px*var(--k));min-width:40px;min-height:40px;border-radius:50%;display:grid;place-items:center;font-size:22px;color:#f3dcb0;
  background:radial-gradient(circle at 40% 35%,#5b3a22,#2a170b);box-shadow:0 0 0 2px var(--brass),0 0 0 3.5px #1a0d05,0 3px 6px rgba(0,0,0,.55);position:absolute;transform:translate(-50%,-50%)}
.sock3.empty{background:radial-gradient(circle at 40% 35%,rgba(91,58,34,.75),rgba(42,23,11,.75));color:#ffcf8a;box-shadow:0 0 0 2px rgba(255,207,138,.8),0 0 0 3.5px #1a0d05;animation:pulse 1.6s infinite}
.sock3.sel{box-shadow:0 0 0 3px #ffcf8a,0 0 0 5px #1a0d05,0 0 16px #ff8a2b}
.sock3 .lv{position:absolute;bottom:-5px;right:-5px;font-family:var(--sc);font-weight:800;font-size:11px;background:#f3dcb0;color:#2b1606;border-radius:7px;padding:0 4px;box-shadow:0 0 0 1px #3b2408}
.sock3 .hpb{position:absolute;left:4px;right:4px;bottom:-9px;height:4px;border-radius:2px;background:#1d0f08;overflow:hidden}.sock3 .hpb i{display:block;height:100%;background:#9be37a}
/* raid prep overlay */
#raidUI{position:fixed;inset:0;z-index:28;pointer-events:none}
#raidUI .pe{pointer-events:auto}
#raidSocks{position:absolute;inset:0;z-index:0;pointer-events:none}
#raidTop,#raidGo,#raidSheet{z-index:2}
#raidTop{position:absolute;top:calc(var(--st) + 8px);left:calc(var(--sl) + 8px);right:calc(var(--sr) + 8px);display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
#raidTop .woodframe{flex:0 1 auto;width:min(540px,calc(100vw - 16px - var(--sl) - var(--sr)))}
#raidTop .inner{padding:6px 9px;font-size:12.5px;line-height:1.3}
html.land #raidTop .woodframe{width:min(470px,48vw)}
#raidTop .btn.small{min-height:36px;padding:4px 10px}
@media (pointer:coarse){#raidTop .btn.small{min-height:44px}}
#raidSheet{position:absolute;right:calc(var(--sr) + 8px);bottom:calc(var(--sb) + 8px);width:min(400px,calc(100vw - 16px));max-height:calc(100% - var(--st) - var(--sb) - 110px);display:flex}
#raidSheet .woodframe{width:100%;display:flex;flex-direction:column;min-height:0}
#raidSheet .inner{padding:10px;overflow-y:auto;flex:1;min-height:0;touch-action:pan-y}

/* revive ring */

}

html.land #prompt{bottom:calc(max(var(--sb),4px) + 86px*var(--k))}
html.land #joyHint{bottom:calc(var(--sb) + 30px)}

/* title */
html.land #title{flex-direction:row;justify-content:space-around;align-items:center;padding:calc(var(--st) + 12px) calc(var(--sr) + 24px) calc(var(--sb) + 12px) calc(var(--sl) + 24px)}

/* panels */
html.land #panel{padding:calc(max(var(--st),4px) + 4px) calc(max(var(--sr),6px) + 6px) calc(max(var(--sb),4px) + 4px) calc(max(var(--sl),6px) + 6px)}
html.land #pFrame{width:min(1080px,100%)}
html.land #pFrame>.woodframe>.inner{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
html.land #pHead{grid-column:1/-1;padding:5px 8px 4px}

html.land #pTabs{grid-column:1;grid-row:2;flex-direction:column;overflow-y:auto;overflow-x:hidden;padding:6px 0 6px 6px;gap:4px;border-right:1px solid rgba(90,59,34,.3);min-height:0}

html.land .cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}

/* dialog */

/* story */

/* results */
html.land #res{padding:calc(max(var(--st),4px) + 6px) calc(max(var(--sr),8px) + 8px) calc(max(var(--sb),4px) + 6px) calc(max(var(--sl),8px) + 8px)}

/* boons */
html.land #boons{padding:calc(var(--st) + 8px) calc(var(--sr) + 12px) calc(var(--sb) + 8px) calc(var(--sl) + 12px);gap:8px}
html.land .boonRow{display:flex;flex-direction:row;gap:12px;justify-content:center;width:100%;flex-wrap:nowrap}
html.land .boon{width:min(260px,30vw);flex-direction:column;text-align:center;padding:10px 8px;gap:6px}

.boonRow{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%}
/* short landscape (≤430px tall: most phones) */
html.land.short #hQuest .q+.q{display:none}
html.land.short .sect{margin:8px 0 4px}
html.land.short .card{padding:7px 8px;margin-bottom:6px}

/* extra short (≤340px tall: 568×320, 640×300) */
html.land.xshort #hQuest{display:none}
html.land.xshort #hObj small{display:none}

html.land.roomy #pFrame{width:min(1120px,94vw)}

/* ===== «Вече» (p8n): leaderboard, clans, neighbour raids ===== */
#mNet.off{opacity:.55;filter:grayscale(.7)}
.lb{display:flex;flex-direction:column;gap:3px}
.lbrow{display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:4px 8px 4px 8px;background:rgba(255,248,230,.45);box-shadow:inset 0 0 0 1px rgba(90,59,34,.25);font-size:13.5px}

#lootFeed{position:fixed;left:calc(var(--sl) + 8px);top:calc(var(--st) + 156px);z-index:28;display:flex;flex-direction:column;gap:3px;pointer-events:none;max-width:min(230px,40vw)}

.lf{display:flex;align-items:center;gap:6px;font-family:var(--sc);font-weight:700;font-size:12px;color:#f3e2bf;padding:2px 8px 2px 3px;border-radius:3px 8px 3px 8px;
  background:linear-gradient(90deg,rgba(28,15,7,.82),rgba(28,15,7,.45));box-shadow:inset 2px 0 0 var(--rc,#c9973f);animation:lfin .25s ease-out;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.lf b{font-weight:800}.lf .r0{color:#e8dcc0}.lf .r1{color:#8cc4ff}.lf .r2{color:#d0a8ff}.lf .r3{color:#ffc860}.lf .r4{color:#ff8a70}

.lf .ic,.lf svg{width:14px;height:14px;vertical-align:-2px}

@keyframes lfin{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}

#synCall.s_steam{color:#f0f6ff;-webkit-text-stroke-color:#3a4a5a}#synCall.s_oil{color:#ffb04a;-webkit-text-stroke-color:#4a1000}#synCall.s_flash{color:#9fe8ff;-webkit-text-stroke-color:#102a4a}#synCall.s_plasma{color:#ffd0ff;-webkit-text-stroke-color:#3a0a3a}

  background:linear-gradient(90deg,rgba(60,18,6,.92),rgba(30,10,4,.82));box-shadow:0 0 0 1.5px #ff8a2b88,0 0 18px #ff6a1a55;color:#ffe8c0;font-family:var(--body);font-size:calc(13.5px*var(--k,1));pointer-events:none;opacity:0;transform:translateX(-14px);transition:opacity .35s,transform .35s}

#cineCap.on{opacity:1} #cineCap small{font-family:var(--sc);letter-spacing:.4em;color:var(--emberL)} #cineCap h2{font-family:var(--disp);font-size:calc(38px*var(--k));margin:.1em 0} #cineCap p{font-size:calc(17px*var(--k));font-family:var(--body)}

      get: function (id) { return pub('GET', '/clan/' + (id | 0)); },

    },

      opponents: function () { return call('GET', '/raid/opponents'); },
      /** Start a raid -> { raidId, snapshot, defender }. */

      /** Open Telegram's share sheet with my invite link. */
      share: function (text) {

      },
      addFriend: function (pid) { return call('POST', '/friends/add', { pid: pid }); },
    },

    inbox: {
      /** Unclaimed reward letters (referrals, gifts). */
      list: function () { return call('GET', '/inbox'); },
      /** -> { reward } — apply it in the game (giveReward). */
      claim: function (id) { return call('POST', '/inbox/claim', { id: id }); },
    },

    notify: {
      /** Opt in/out of bot reminders. Telegram may ask the user to allow messages first. */
      setEnabled: function (on) {
        var w = tg();

      schedule: function (kind, inSec) { return call('POST', '/notify/schedule', { kind: kind, inSec: Math.round(inSec) }); },
      cancel: function (kind) { return call('POST', '/notify/schedule', { kind: kind, cancel: true }); },

      setName: function (name) {
        return call('POST', '/me/settings', { name: name === null ? null : String(name) }).then(function (r) {

    progressScore: progressScore,

  try{ const gl=R.getContext(); const w=gl.drawingBufferWidth, h=gl.drawingBufferHeight; if(!w||!h) return;
    if(!LUMA.buf||LUMA.buf.length!==w*4) LUMA.buf=new Uint8Array(w*4); let sum=0,n=0;

        if(typeof track==='function') track('luma_guard','s'+LUMA.step); } }

function mkRig(o){ const root=new THREE.Group(); const body=piv(root,0,o.hip||0,0); return Object.assign({root,body},o); }
function biped(id,o){
  // o: {hip, legGeo, torsoGeo, armLGeo, armRGeo, shX, shY, legX, h, r}
  const rig=mkRig({hip:o.hip,type:'biped',h:o.h,r:o.r});
  rig.legL=piv(rig.body,-o.legX,0,0); rig.legR=piv(rig.body,o.legX,0,0);
  if(o.legGeo){ pmesh(o.legGeo,rig.legL); pmesh(o.legGeoR||o.legGeo,rig.legR); }
  rig.torso=piv(rig.body,0,0,0); pmesh(o.torsoGeo,rig.torso);
  rig.armL=piv(rig.torso,-o.shX,o.shY,o.shZ||0); rig.armR=piv(rig.torso,o.shX,o.shY,o.shZ||0);
  if(o.armLGeo) pmesh(o.armLGeo,rig.armL); if(o.armRGeo) pmesh(o.armRGeo,rig.armR);
  if(o.headGeo){ rig.head=piv(rig.torso,0,o.headY,o.headZ||0); pmesh(o.headGeo,rig.head); }
  return rig;
}
function quadRig(o){
  const rig=mkRig({hip:o.hip,type:'quad',h:o.h,r:o.r});
  rig.torso=piv(rig.body,0,0,0); pmesh(o.bodyGeo,rig.torso);
  const lx=o.lx, lz=o.lz;
  rig.fl=piv(rig.body,-lx,o.ly,lz); rig.fr=piv(rig.body,lx,o.ly,lz); rig.bl=piv(rig.body,-lx,o.ly,-lz); rig.br=piv(rig.body,lx,o.ly,-lz);
  for(const k of ['fl','fr','bl','br']) pmesh(o.legGeo,rig[k]);
  if(o.headGeo){ rig.head=piv(rig.torso,0,o.headY,o.headZ); pmesh(o.headGeo,rig.head); }
  return rig;
}

// ---------- item meshes for icons & world drops ----------
function itemIconObj(it){
  const B=ITEM_BASES[it.base]; let geo;
  if(B.slot==='weapon'||B.slot==='offhand') geo=wpnGeo(B.vis,it.rar,it.el||'');
  else geo=armorIconGeo(B.slot==='ring1'||B.slot==='ring2'?'ring':B.slot,B.vis,it.rar,it.el||'');
  const m=new THREE.Mesh(geo,MT);
  return {m,slot:B.slot,cls:B.cls,vis:B.vis};
}
const ICON_CACHE={};
function iconForProc(it){
  if(!it) return '';
  const key=it.base+'_'+it.rar+'_'+(it.el||'');
  if(ICON_CACHE[key]) return ICON_CACHE[key];
  const o=itemIconObj(it); const g=new THREE.Group(); g.add(o.m);
  const B=ITEM_BASES[it.base];
  // pose
  if(B.slot==='weapon'){
    if(B.cls==='bow'){ o.m.rotation.set(0,0,-.75); }
    else { o.m.rotation.set(0,0,-.78); const bb=new THREE.Box3().setFromObject(g); const c=bb.getCenter(new THREE.Vector3()); o.m.position.sub(c); }
  } else if(B.slot==='offhand'){ o.m.rotation.set(.1,.5,0); if(B.oh==='quiver') o.m.rotation.set(0,0,-.5); }
  else if(B.slot==='chest'){ o.m.rotation.set(.15,.5,0); o.m.position.y=-.2; }
  else if(B.slot==='helm'){ o.m.rotation.set(.25,.6,0); }
  else if(B.slot==='boots'){ o.m.rotation.set(.2,-.8,0); }
  else if(B.slot==='gloves'){ o.m.rotation.set(.1,.5,.2); }
  else { o.m.rotation.set(.3,.3,0); }
  const bb=new THREE.Box3().setFromObject(g); const sz=bb.getSize(new THREE.Vector3()); const c=bb.getCenter(new THREE.Vector3());
  const d=Math.max(sz.x,sz.y,sz.z*0.7)*1.95+.2;
  const url=RTT.shot(g,128,[c.x,c.y+d*.12,c.z+d],[c.x,c.y,c.z]);
  return ICON_CACHE[key]=url;
}
function iconForGeo(key,geo,rot,dist){
  if(ICON_CACHE[key]) return ICON_CACHE[key];
  const m=new THREE.Mesh(geo,MT); if(rot) m.rotation.set(...rot); const g=new THREE.Group(); g.add(m);
  const bb=new THREE.Box3().setFromObject(g); const sz=bb.getSize(new THREE.Vector3()); const c=bb.getCenter(new THREE.Vector3()); const d=(dist||1)*Math.max(sz.x,sz.y)*1.9+.1;
  return ICON_CACHE[key]=RTT.shot(g,128,[c.x,c.y+d*.15,c.z+d],[c.x,c.y,c.z]);
}
function portraitOf(rig,key,opts={}){
  if(key&&ICON_CACHE['p_'+key]&&!opts.fresh) return ICON_CACHE['p_'+key];
  const g=new THREE.Group(); g.add(rig.root); rig.root.updateMatrixWorld(true);
  const hy=(opts.hy||rig.h*0.86);
  const url=RTT.shot(g,192,[opts.x||0.35,hy+0.12,opts.dist||1.6],[0,hy-0.08,0],opts.bg);
  if(key) ICON_CACHE['p_'+key]=url; return url;
}

// ================= p5: systems (items, stats, progression, economy, quests) =================
const slotKey=s=>(s==='ring1'||s==='ring2')?'ring':s;
function rollRarity(mf,min=0,max=4){
  const m=1+(mf||0)/100; const r=Math.random();
  let k=0; if(r<.004*m)k=4; else if(r<.035*m)k=3; else if(r<.13*m)k=2; else if(r<.38*m)k=1;
  return clamp(k,min,max);
}
function genItem(ilvl,o={}){
  ilvl=Math.max(1,Math.round(ilvl));
  let pool=Object.keys(ITEM_BASES).filter(k=>{const b=ITEM_BASES[k]; return b.t<=ilvl+2&&(!o.slot||slotKey(b.slot)===o.slot)&&(!o.cls||b.cls===o.cls);});
  if(!pool.length) pool=Object.keys(ITEM_BASES).filter(k=>!o.slot||ITEM_BASES[k].slot===o.slot);
  // weight newer bases higher
  let base=o.base;
  if(!base){ const w=pool.map(k=>1+ITEM_BASES[k].t/6); let s=w.reduce((a,b)=>a+b,0)*Math.random(); base=pool[pool.length-1]; for(let i=0;i<pool.length;i++){ s-=w[i]; if(s<=0){base=pool[i];break;} } }
  const B=ITEM_BASES[base];
  const rar=o.rar!==undefined?o.rar:rollRarity(o.mf,o.rmin||0,o.rmax===undefined?4:o.rmax);
  const it={id:S.uid++,base,rar,ilvl,aff:[],el:null,set:null,uniq:null,sock:[],up:0,lock:false,nw:true};
  const sk=slotKey(B.slot);
  if(B.slot==='weapon'&&(chance(.3+rar*.12)||o.el)) it.el=o.el||pick(['fire','ice','poison','light']);
  const pool2=AFFIX_SLOTS[sk].slice();
  const nAff=RAR[rar].aff;
  if(it.el){ it.aff.push({k:it.el,v:AFFIX[it.el].r(ilvl)*1.3}); }
  while(it.aff.length<nAff&&pool2.length){ const k=pool2.splice(randi(0,pool2.length-1),1)[0]; if(it.aff.some(a=>a.k===k)) continue; if(AFFIX[k].el&&it.el&&k!==it.el) continue; it.aff.push({k,v:AFFIX[k].r(ilvl)*(1+rar*.08)}); }
  if(rar===3&&(o.set||chance(.35))){ const sid=o.set||Object.keys(SETS).find(s=>Object.values(SETS[s].pieces).includes(base)&&(s!=='king'||ilvl>=20)); if(sid&&Object.values(SETS[sid].pieces).includes(base)) it.set=sid; }
  if(rar===4){ it.uniq=B.slot==='weapon'?UNIQUES[B.cls].id:(B.slot==='amulet'||sk==='ring')?(chance(.5)?'phoenix':'catalyst'):B.slot==='gloves'&&chance(.6)?'glacier':'ashskin'; S.st.myth=(S.st.myth||0)+1; }
  const ns=rar===4?2:rar===3?1:rar===2?(chance(.5)?1:0):0; for(let i=0;i<ns;i++) it.sock.push(null);
  it.name=itemName(it);
  return it;
}
function itemName(it){
  const B=ITEM_BASES[it.base];
  if(it.rar===4){ const u=Object.values(UNIQUES).find(u=>u.id===it.uniq); return B.name+' «'+(u?u.n:'Миф')+'»'; }
  if(it.set){ return SET_ITEM_NAMES[it.set][slotKey(B.slot)]; }
  if(it.rar===3) return B.name+' «'+pick(LEG_NAMES)+'»';
  if(it.rar>=1&&it.aff.length) return B.name+' '+AFFIX[it.aff[0].k].sx;
  return B.name;
}
const upMul=it=>1+.08*(it.up||0);
function itemMain(it){
  const B=ITEM_BASES[it.base], m=RAR[it.rar].m*upMul(it), f=F(it.ilvl); const o={};
  if(B.dmg) o.wdmg=B.dmg*f*m;
  if(B.armor) o.armor=B.armor*f*m;
  if(B.hp) o.hp=B.hp*f*m;
  for(const k of ['dmgP','crit','skill','cdr','aspd','move']) if(B[k]) o[k]=B[k]*m;
  return o;
}
function itemStats(it){
  const o=itemMain(it); const um=upMul(it);
  for(const a of it.aff){ o[a.k]=(o[a.k]||0)+a.v*um; }
  for(const g of it.sock){ if(!g) continue; const G=GEMS[g.slice(0,-1)], t=+g.slice(-1); o[G.st]=(o[G.st]||0)+G.v[t]; }
  return o;
}
function itemPower(it){
  if(!it) return 0; const B=ITEM_BASES[it.base]; const sw=B.slot==='weapon'?2.2:B.slot==='chest'?1.3:1;
  return Math.round(it.ilvl*9*RAR[it.rar].m*upMul(it)*sw+it.aff.length*it.ilvl*2.2+it.sock.filter(Boolean).length*25+(it.uniq?it.ilvl*6:0)+(it.set?it.ilvl*3:0));
}
function gearPower(){ let p=0; for(const k in S.gear) p+=itemPower(S.gear[k]); return p; }
function fmtStat(k,v){ return AFFIX[k]?AFFIX[k].t.replace('{v}',AFFIX[k].int||v>=20?Math.round(v):(+v.toFixed(1))):k+' '+v; }
function salvageValue(it){ const f=F(it.ilvl); return {ore:Math.round((3+it.rar*4)*Math.sqrt(f)),ess:it.rar>=2?Math.round((it.rar-1)*2*Math.sqrt(f)):0,gold:Math.round(8*f*(1+it.rar))}; }

// ---------- stats ----------
let PS={};
let RUNBUF={}; // per-run buffs (elixirs, boons)
function setCount(){ const c={}; for(const k in S.gear){ const it=S.gear[k]; if(it&&it.set) c[it.set]=(c[it.set]||0)+1; } return c; }
function curCls(){ return S.gear.weapon?ITEM_BASES[S.gear.weapon.base].cls:'sword'; }
function computeStats(){
  const L=S.hero.lvl; const s={hp:0,wdmg:0,armor:0,armorP:0,hpP:0,res:0,dmgP:0,crit:5,critD:50,aspd:0,move:0,regen:0,regenP:0,ls:0,cdr:0,gold:0,mf:0,thorns:0,thornsP:0,
    fire:0,ice:0,poison:0,light:0,elP:0,skill:0,pet:0,xp:0,pierce:0,spellShield:0,dr:0,burn:0,ult:0,uniq:{}};
  const add=(o)=>{ for(const k in o){ if(k==='uniq')continue; s[k]=(s[k]||0)+o[k]; } };
  for(const k in S.gear){ const it=S.gear[k]; if(!it) continue; add(itemStats(it)); if(it.uniq) s.uniq[it.uniq]=1; }
  const sc=setCount(); s.sets=sc;
  for(const id in sc){ if(sc[id]>=2) add(SETS[id].b2); if(sc[id]>=4) add(SETS[id].b4); }
  const cls=curCls(); const T=S.hero.talents[cls]||{};
  for(const p of PASSIVES[cls]) if(T[p.id]) add(p.st(T[p.id]));
  for(const b in S.bless) if(S.bless[b]) add(BLESS[b].st(S.bless[b]));
  if(RUNBUF.str) s.dmgP+=25; if(RUNBUF.def){ s.armorP+=30; s.res+=15; } if(RUNBUF.spd){ s.move+=15; s.aspd+=15; }
  if(RUNBUF.boons){ const B=RUNBUF.boons; s.dmgP+=15*(B.dmg||0); s.hpP+=20*(B.hp||0); s.aspd+=12*(B.aspd||0); s.crit+=8*(B.crit||0); s.critD+=20*(B.crit||0); s.cdr+=15*(B.cdr||0); s.ls+=4*(B.ls||0); s.pet+=40*(B.pet||0); s.move+=12*(B.move||0); s.thorns+=(B.thorns||0)*6*F(L); s.ult+=30*(B.ult||0); }
  // pets passive
  if(petActive('owl')) s.mf+=15+petLv('owl')*1.5;
  if(petActive('fairy')) s.regenP+=.5+petLv('fairy')*.05;
  const baseHp=95*Math.pow(F(L),.88)+8*L;
  s.maxHp=Math.round((baseHp+s.hp)*(1+s.hpP/100));
  if(!s.wdmg) s.wdmg=6*F(L);
  s.atk=s.wdmg*(1+s.dmgP/100)*(1+.025*(L-1));
  s.armorT=s.armor*(1+s.armorP/100);
  s.res=Math.min(s.res,75); s.crit=Math.min(s.crit,75); s.cdr=Math.min(s.cdr,50); s.ls=Math.min(s.ls,20); s.dr=Math.min(s.dr,40);
  if(s.uniq.ashskin) s.dr+=15; if(s.uniq.catalyst) s.synP=(s.synP||0)+60;
  s.regenT=s.regen+s.maxHp*s.regenP/100;
  s.moveT=5.4*(1+s.move/100);
  s.aspdT=1+s.aspd/100;
  s.thornsT=s.thorns*(1+s.thornsP/100);
  s.cls=cls;
  PS=s; return s;
}
const xpNeed=l=>Math.round(55*Math.pow(l,1.6)+45);
const MAX_LVL=40;
function addXp(n){
  n=Math.round(n*(1+(PS.xp||0)/100)); if(S.hero.lvl>=MAX_LVL) return;
  S.hero.xp+=n;
  while(S.hero.lvl<MAX_LVL&&S.hero.xp>=xpNeed(S.hero.lvl)){ S.hero.xp-=xpNeed(S.hero.lvl); S.hero.lvl++; S.hero.tp++; onLevelUp(); }
}
function talentRank(cls,id){ return (S.hero.talents[cls]||{})[id]||0; }
function skillRank(id){ return talentRank(curCls(),id); }

// ---------- inventory ----------
function invCap(){ return 40+S.bld.store*8; }
function addItem(it,quiet){
  if(S.inv.length>=invCap()){ const v=salvageValue(it); for(const k in v) S.res[k]=(S.res[k]||0)+v[k]; if(!quiet) toast(`Сумка полна — <b>${esc(it.name)}</b> разобран`,iconFor(it),it.rar,'loot'); return false; }
  S.inv.push(it); if(!quiet) toast(`<b class="r${it.rar}">${esc(it.name)}</b>`,iconFor(it),it.rar,'loot'); return true;

  while(list.length<n&&pool.length){ const d=pool.splice(randi(0,pool.length-1),1)[0]; if(d.id==='d_abyss'&&S.endless.best<1&&!stageDone('1-5')) continue; list.push({id:d.id,v:d.v,p:0,c:false}); }

    const id=q.id;

    if(id==='d_stage'&&type==='stage') q.p++;

function buildGround(Z,b,opts={}){

    if(Z.tiles){ const tx=Math.floor(x/2.2),tz=Math.floor(z/2.2); if((tx+tz)&1) tmp.multiplyScalar(.9); const fx=Math.abs(x/2.2-Math.round(x/2.2)),fz=Math.abs(z/2.2-Math.round(z/2.2)); if(fx<.06||fz<.06) tmp.multiplyScalar(.75); }

// ---------- unload ----------
function unloadWorld(){
  if(!W) return;
  for(const c of worldRoot.children.slice()){ worldRoot.remove(c); if(c.isMesh&&c===W.ground){ c.geometry.dispose(); } if(c===W.liquid){ c.geometry.dispose(); c.material.dispose(); } if(c.isInstancedMesh){ c.dispose&&c.dispose(); } if(c.userData&&c.userData.evInst){ for(const k of c.children) k.dispose&&k.dispose(); } }

// ---------- path layout ----------
function genPath(nNodes,o={}){
  const nodes=[], segs=[]; let x=0,z=0;
  nodes.push({x,z,r:o.r0||7});
  for(let i=1;i<nNodes;i++){
    z-=rand(o.dmin||17,o.dmax||23); x=clamp(x+rand(-11,11),-16,16);
    nodes.push({x,z,r:o.big&&i===nNodes-1?o.big:rand(6,8.5)});
    segs.push({ax:nodes[i-1].x,az:nodes[i-1].z,bx:x,bz:z,w:rand(5.5,7)});
  }
  return {nodes,segs};
}
function addSideRoom(walk,fromIdx){
  const n=walk.nodes[fromIdx]; const side=n.x>0?-1:1; const x=n.x+side*rand(13,17), z=n.z+rand(-5,5);
  const room={x,z,r:3.6,side:true}; walk.nodes.push(room); walk.segs.push({ax:n.x,az:n.z,bx:x,bz:z,w:3.0,side:true}); return room;
}
function boundsOf(walk,pad=20){ let a=1e9,b=-1e9,c=1e9,d=-1e9; for(const n of walk.nodes){ a=Math.min(a,n.x-n.r);b=Math.max(b,n.x+n.r);c=Math.min(c,n.z-n.r);d=Math.max(d,n.z+n.r);} return {minX:a-pad,maxX:b+pad,minZ:c-pad,maxZ:d+pad}; }

}
function petDmg(p,mult){ const lv=petLv(p.kind); return PS.atk*.55*mult*(1+.11*(lv-1))*(1+PS.pet/100); }
function updatePets(dt){
  const P=G.P; const combat=G.mode!=='village';
  for(const p of G.pets){ p.t+=dt; p.cd-=dt; if(p.tauntT>0) p.tauntT-=dt; if(p.hitT>0) p.hitT-=dt;
    const side=p.slot===0?1:-1; const hx=P.x-Math.sin(P.face)*1.3+Math.cos(P.face)*side*1.2, hz=P.z-Math.cos(P.face)*1.3-Math.sin(P.face)*side*1.2;
    let tx=hx,tz=hz; let tg=null;
    if(combat){ tg=nearestEnemy(P.x,P.z,9); }
    const K=p.kind; const rng={wolf:1.4,sala:6,owl:7,golem:1.8,fairy:99,mush:2.5,drake:5,otter:6}[K]||3;
    if(tg&&K!=='fairy'){ const d=dist(p,tg); if(d>rng){ tx=tg.x; tz=tg.z; } else { tx=p.x; tz=p.z; p.face=Math.atan2(tg.x-p.x,tg.z-p.z);
        if(p.cd<=0){ petAct(p,tg); } } }
    const dx=tx-p.x,dz=tz-p.z,d=Math.hypot(dx,dz);
    const sp=(d>8?PS.moveT*1.5:PS.moveT*1.05);
    if(d>.35){ const m=Math.min(d,sp*dt); p.x+=dx/d*m; p.z+=dz/d*m; p.face=angTo(p.face,Math.atan2(dx,dz),dt*10); p.moving=Math.min(1,d/2); } else p.moving=0;

function updateWaves(dt){
  const P=G.P;
  for(let i=G.waves.length-1;i>=0;i--){ const w=G.waves[i]; w.r+=w.spd*dt;
    if(!w.m){ w.m=ringMesh(w.col||0xff8a2a,1,.08,.9); worldRoot.add(w.m); }
    w.m.position.set(w.x,.15,w.z); w.m.scale.setScalar(w.r); w.m.material.opacity=.9*(1-w.r/w.max);
    if(Math.random()<.8){ const a=rand(TAU); fx(w.team==='e'?'fire':'dust',w.x+Math.cos(a)*w.r,.1,w.z+Math.sin(a)*w.r,{k:1}); }
    if(w.team==='e'){ const d=Math.hypot(P.x-w.x,P.z-w.z); if(!w.hit&&Math.abs(d-w.r)<w.w/2+P.r&&(P.y||0)<.5){ w.hit=true; hurtPlayer(w.dmg,{src:w.src,lvl:w.src?w.src.lvl:W.lvl,kb:6,dir:Math.atan2(P.x-w.x,P.z-w.z),el:'fire'}); } }
    else { for(const e of G.enemies){ if(!e.alive||w.hit.has(e)) continue; const d=Math.hypot(e.x-w.x,e.z-w.z); if(Math.abs(d-w.r)<w.w/2+e.r){ w.hit.add(e); const h=heroDmg(w.mult,{skill:1}); dmgEnemy(e,h.amt,{crit:h.crit,els:h.els,kb:5,dir:Math.atan2(e.x-w.x,e.z-w.z),src:P}); } } }
    if(w.r>=w.max){ worldRoot.remove(w.m); w.m.geometry.dispose(); w.m.material.dispose(); G.waves.splice(i,1); }
  }
  for(let i=TRAPS.length-1;i>=0;i--){ const t=TRAPS[i]; t.t-=dt; t.armed-=dt; let boom=t.t<=0;
    if(t.armed<=0) for(const e of G.enemies){ if(e.alive&&!e.burrowed&&Math.hypot(e.x-t.x,e.z-t.z)<1.2+e.r){ boom=true; break; } }
    if(boom){ fx('boom',t.x,0,t.z,{r:2.6}); aoeDamage(t.x,t.z,2.6,t.mult,{skill:1,stun:2,kb:1}); AU.sfx('boom',.7); worldRoot.remove(t.m); TRAPS.splice(i,1); } }
}

const DN=[]; const _pv3=new THREE.Vector3();
function dmgNum(x,y,z,txt,cls){
  if(!S.set.dmg&&cls!=='heal'&&cls!=='pl'&&cls!=='gold'&&cls!=='txt') return;
  let d=DN.find(q=>!q.on); if(!d){ if(DN.length>=40) d=DN[0]; else { const el=document.createElement('div'); el.className='dn'; $('dmg').appendChild(el); d={el}; DN.push(d); } }
  d.on=true; d.t=0; d.x=x+rand(-.4,.4); d.y=y; d.z=z+rand(-.2,.2); d.el.textContent=txt; d.el.className='dn '+(cls||''); d.el.style.display='block'; d.vx=rand(-20,20); d.life=cls==='crit'?1.1:cls&&cls.startsWith('syn')?1.5:.85;
}
function updateDmgNums(dt){
  const w=window.innerWidth,h=window.innerHeight;
  for(const d of DN){ if(!d.on) continue; d.t+=dt; if(d.t>d.life){ d.on=false; d.el.style.display='none'; continue; }
    _pv3.set(d.x,d.y+d.t*1.6,d.z).project(cam); const sx=(_pv3.x*.5+.5)*w+d.vx*d.t, sy=(-_pv3.y*.5+.5)*h;
    const u=d.t/d.life; const sc=u<.12?.6+u/.12*.6:1.2-Math.min(.2,u*.3); d.el.style.transform=`translate(${sx}px,${sy}px) translate(-50%,-50%) scale(${sc})`; d.el.style.opacity=u>.7?(1-u)/.3:1; }
}

const HB=[];
function updateHpBars(){
  const w=window.innerWidth,h=window.innerHeight; let n=0;
  for(const e of G.enemies){ if(!e.alive||e.boss||e.burrowed) continue; if(!(e.elite||(e.lastHit&&G.time-e.lastHit<3))) continue; if(n>=14) break;
    let b=HB[n]; if(!b){ const el=document.createElement('div'); el.style.cssText='position:absolute;left:0;top:0;width:44px;height:6px;border-radius:3px;background:#1d0f08;box-shadow:0 0 0 1.5px #3a2410;overflow:hidden;pointer-events:none'; el.innerHTML='<i style="display:block;height:100%;background:linear-gradient(180deg,#ff7a62,#b32a1c);transform-origin:left"></i>'; $('dmg').appendChild(el); b=HB[n]={el,i:el.firstChild}; }
    _pv3.set(e.x,(e.rig.h||1.5)*e.rig.root.scale.x+.35+e.y,e.z).project(cam); const sx=(_pv3.x*.5+.5)*w, sy=(-_pv3.y*.5+.5)*h;
    b.el.style.display='block'; b.el.style.transform=`translate(${sx-22}px,${sy}px)`; b.i.style.transform=`scaleX(${clamp(e.hp/e.maxHp,0,1)})`; b.el.style.boxShadow=e.elite?'0 0 0 1.5px #3a2410,0 0 0 3px '+(e.champion?'#ffcf4a':'#c47cff'):'0 0 0 1.5px #3a2410'; n++; }

  pay(bldCost(id,lv+1)); S.bld[id]++; S.st.built++; AU.sfx('build'); vib('success');
  toast(`${BUILDINGS[id].n}: ${lv?'улучшено до '+S.bld[id]+' ур.':'построено!'}`,null,null,'quest');
  if(id==='alch') {} if(G.mode==='village'&&W&&W.kind==='village'){ buildVillageBuildings(); refreshVillagers(); const p=id==='houses'?HOUSE_POS[Math.min(HOUSE_POS.length-1,S.bld.houses*2-1)]:id==='walls'?TOWER_POS[0]:VPOS[id]; if(p){ for(let i=0;i<4;i++) fx('dust',p[0]+rand(-2,2),0,p[1]+rand(-2,2),{k:8}); fx('lvl',p[0],0,p[1]); } }
  ev('build'); saveGame(); questCheck();
  const npcDlg={forge:'smith_hi',alch:'alch_hi',pen:'beast_hi'}[id];
  if(npcDlg&&!S.seen[npcDlg]){ closePanel(); later(.4,()=>playDialog(npcDlg)); return; }
  rerender();
}
function bldBody(id,tab){
  const lv=S.bld[id], B=BUILDINGS[id];
  if(tab==='bld'||!lv){
    let h=`<div class="card"><p class="dcap">${B.d}</p>${lv?`<div><b>Сейчас:</b> ${B.eff(lv)}</div>`:''}${lv<5?`<div><b>${lv?'Дальше':'После постройки'}:</b> ${B.eff(lv+1)}</div>`:'<div><b>Максимальный уровень</b></div>'}</div>`;
    if(lv<5){ const c=bldCost(id,lv+1); const lockHall=id!=='hall'&&lv+1>S.bld.hall; const lockU=bldUnlock(id)>S.bld.hall;
      h+=`<div class="card row"><div class="grow"><b>${lv?'Улучшение до '+(lv+1)+' ур.':'Строительство'}</b><div>${costHtml(c)}</div>${lockU?`<div class="muted">Нужна ратуша ${bldUnlock(id)} ур.</div>`:lockHall?`<div class="muted">Сначала улучшите ратушу до ${lv+1} ур.</div>`:''}</div><button class="btn leather" ${canBuildNow(id)?'':'disabled'} ${act(()=>doBuild(id))}>${ico('hammer')} ${lv?'Улучшить':'Построить'}</button></div>`; }
    if(['saw','mine','well','hall','houses'].includes(id)&&lv){ const r=prodRates(); h+=`<div class="muted">Производство копится, пока вы в походе или вне игры (до ${prodCapHours()} ч.).</div>`; }
    return h;
  }
  if(id==='hall'){
    if(tab==='prod'){ const r=prodRates(); return `<div class="card"><h4>Доход деревни в час</h4>${Object.keys(r).map(k=>`<div class="row">${resChip(k,r[k])}<span class="muted">${RES_NAME[k]}</span></div>`).join('')}<div class="muted">Склад хранит до ${prodCapHours()} ч. производства. Улучшайте лесопилку, рудник, родник и дома.</div></div>`+bldBody('hall','bld'); }
    let h='';
    for(const b of BLD_ORDER){ const l=S.bld[b], c=l<5?bldCost(b,l+1):null; const can=canBuildNow(b); const lockU=bldUnlock(b)>S.bld.hall;
      h+=`<div class="card row" style="${lockU?'opacity:.55':''}"><span style="font-size:30px;color:#5a3b22">${ico(BUILDINGS[b].ic)}</span><div class="grow"><h4>${BUILDINGS[b].n} <span class="pill">${l?l+' ур.':'нет'}</span></h4><div class="muted">${lockU?'Нужна ратуша '+bldUnlock(b)+' ур.':l<5?costHtml(c):'Максимум'}</div></div>${l<5&&!lockU?`<button class="btn ${can?'leather':'woodb'} small" ${can?'':'disabled'} ${act(()=>doBuild(b))}>${l?'Улучшить':'Строить'}</button>`:''}${l&&BUILDINGS[b].npc!==undefined&&bldTabs(b).length>1?`<button class="btn woodb small" ${act(()=>openPanel('bld',{id:b}))}>Открыть</button>`:''}</div>`; }
    return h;
  }
  if(id==='forge') return forgeBody(tab);
  if(id==='alch') return alchBody();
  if(id==='pen') return tab==='pets'?pPets('feed'):penBody();
  if(id==='tavern'&&tab==='roster') return rosterBody();
  if(id==='tavern'&&tab==='exp') return expBody();
  if(id==='tavern') return tab==='daily'?pQuests().split('<div class="sect">Контракты дня</div>')[1].split('<div class="sect">Достижения')[0].replace(/^/,'<div class="sect">Контракты дня</div>'):boardBody();
  if(id==='temple') return templeBody(tab);
  return '';
}

const craftCost=()=>{ const L=S.hero.lvl; return {gold:Math.round(110*F(L)),ore:Math.round(18*Math.sqrt(F(L))),wood:12}; };

function pickerGrid(filter){ return `<div id="invGrid">${allItems().filter(filter||(()=>true)).map(it=>`<div>${slotHtml(ITEM_BASES[it.base].slot,it,act(()=>{ PANEL.sel=it; PANEL.aff=null; rerender(); }))}${Object.values(S.gear).includes(it)?'<span style="display:block;text-align:center;font-size:10px;font-family:var(--sc);font-weight:800;color:#7c2418">надето</span>':''}</div>`).join('')}</div>`; }

  for(const q of SIDE){ const s=S.q.side[q.id]; const st=s?s.st:'none';
    if(st==='done') continue;
    let right='';
    if(st==='act'){ const [p,t]=goalProgress(q.goal,s.b); right=p>=t?`<button class="btn leather small" ${act(()=>{ turnInSide(q); rerender(); })}>Сдать</button>`:`<span class="pill">${p}/${t}</span>`; }

    h+=`<div class="card row"><div class="grow"><h4>${esc(q.n)} <span class="pill">${NPC_INFO[q.g].n}</span></h4><div class="muted">${esc(q.d)}</div><div>${costHtml(q.rw).replace(/cost no/g,'cost')}</div></div>${right}</div>`; }

}

// ---------- map ----------
const MAP={W:0,H:0,zoneH:380};
function stageUnlocked(z,s){ if(z===1&&s===1) return true; if(s===1) return stageDone((z-1)+'-5'); return stageDone(z+'-'+(s-1)); }
function openMap(){
  if(G.dialog) return; AU.sfx('page'); show('map'); G.mapOpen=true;
  const m=$('map'); const abyss=stageDone('1-5');
  m.innerHTML=`<div id="mapHead"><h2>Карта Вейла</h2>${abyss?`<button class="btn leather small" ${act(()=>abyssCard())}>${ico('abyss')} Бездна</button>`:''}<button class="hbtn" id="mapClose">${ico('close')}</button></div><div id="mapScroll"><canvas id="mapCv"></canvas><div id="mapNodes"></div></div>`;
  $('mapClose').onclick=closeMap;
  drawMap(); bindPanel();
  const cur=findCurrentStage(); const sc=$('mapScroll'); const nd=document.querySelector('.mnode.cur'); if(nd) sc.scrollTop=Math.max(0,parseFloat(nd.style.top)-sc.clientHeight*.55); else sc.scrollTop=sc.scrollHeight;
}
function closeMap(){ show('map',false); show('stageCard',false); G.mapOpen=false; AU.sfx('ui'); }
function findCurrentStage(){ for(let z=1;z<=6;z++) for(let s=1;s<=5;s++) if(!stageDone(z+'-'+s)) return [z,s]; return null; }
function nodePos(z,s,w){ const xs=[.24,.62,.36,.72,.5]; const zi=6-z; const top=zi*MAP.zoneH; const y=top+MAP.zoneH*(.86-(s-1)*.18); return [xs[s-1]*w,y]; }
function drawMap(){
  const sc=$('mapScroll'); const w=Math.min(sc.clientWidth||390,640); const H=6*MAP.zoneH; MAP.W=w; MAP.H=H;
  const cv=$('mapCv'); const dpr=Math.min(2,window.devicePixelRatio||1); cv.width=w*dpr; cv.height=H*dpr; cv.style.width=w+'px'; cv.style.height=H+'px'; cv.style.margin='0 auto';
  const g=cv.getContext('2d'); g.scale(dpr,dpr);
  const r=mulberry(42);
  // parchment base
  const grd=g.createLinearGradient(0,0,0,H); grd.addColorStop(0,'#5a3a30'); grd.addColorStop(.18,'#8a6a50'); grd.addColorStop(.5,'#cdb48a'); grd.addColorStop(1,'#ead8ae'); g.fillStyle=grd; g.fillRect(0,0,w,H);
  const tint=['rgba(140,190,90,.35)','rgba(60,110,50,.35)','rgba(80,95,50,.4)','rgba(70,70,110,.35)','rgba(140,60,30,.35)','rgba(120,20,15,.45)'];
  for(let z=1;z<=6;z++){ const top=(6-z)*MAP.zoneH; g.fillStyle=tint[z-1]; g.fillRect(0,top,w,MAP.zoneH);
    // decorative glyphs per zone
    for(let i=0;i<26;i++){ const x=r()*w, y=top+r()*MAP.zoneH; g.save(); g.translate(x,y); g.globalAlpha=.55;
      if(z===1){ g.fillStyle='#4a7a2a'; g.beginPath(); g.arc(0,0,7+r()*5,0,TAU); g.fill(); g.fillStyle='#5a3a20'; g.fillRect(-1.5,5,3,7); }

      else if(z===3){ g.strokeStyle='#3a4a2a'; g.lineWidth=1.5; g.beginPath(); for(let k=0;k<3;k++){ g.moveTo(-8+k*6,6); g.lineTo(-6+k*6,-8); } g.stroke(); g.fillStyle='rgba(50,70,50,.6)'; g.beginPath(); g.ellipse(0,8,12,3,0,0,TAU); g.fill(); }
      else if(z===4){ g.fillStyle='#4a4a5a'; g.fillRect(-4,-10,8,16); g.beginPath(); g.arc(0,-10,4,PI,0); g.fill(); }
      else if(z===5){ g.fillStyle='#2a1a14'; g.beginPath(); g.moveTo(-6,6); g.lineTo(0,-12); g.lineTo(6,6); g.fill(); g.strokeStyle='#ff7a2a'; g.lineWidth=1; g.beginPath(); g.moveTo(-10,10); g.lineTo(10,9); g.stroke(); }
      else { g.fillStyle='#ff5a2a'; g.globalAlpha=.4; g.beginPath(); g.moveTo(0,-10); g.lineTo(4,0); g.lineTo(0,10); g.lineTo(-4,0); g.fill(); }
      g.restore(); }
    // zone separator: torn line
    g.strokeStyle='rgba(60,35,15,.45)'; g.lineWidth=2; g.setLineDash([6,5]); g.beginPath(); g.moveTo(0,top); for(let x=0;x<=w;x+=12) g.lineTo(x,top+Math.sin(x*.1+z)*4); g.stroke(); g.setLineDash([]);
  }
  // path
  g.strokeStyle='rgba(90,40,20,.8)'; g.lineWidth=3; g.setLineDash([2,7]); g.lineCap='round'; g.beginPath(); let first=true;
  for(let z=1;z<=6;z++) for(let s=1;s<=5;s++){ const [x,y]=nodePos(z,s,w); if(first){ g.moveTo(x,y); first=false; } else g.lineTo(x,y); } g.stroke(); g.setLineDash([]);
  // compass rose
  g.save(); g.translate(w-46,H-60); g.strokeStyle='rgba(90,50,20,.7)'; g.fillStyle='rgba(124,36,24,.75)'; g.lineWidth=1.5; g.beginPath(); g.arc(0,0,22,0,TAU); g.stroke(); for(let i=0;i<4;i++){ g.rotate(PI/2); g.beginPath(); g.moveTo(0,-30); g.lineTo(5,0); g.lineTo(-5,0); g.fill(); } g.restore();
  // fog over locked zones
  const curZ=findCurrentStage()?findCurrentStage()[0]:7;
  for(let z=curZ+1;z<=6;z++){ const top=(6-z)*MAP.zoneH; g.fillStyle='rgba(30,20,15,.55)'; g.fillRect(0,top,w,MAP.zoneH); }
  // nodes

    for(let s=1;s<=5;s++){ const [x,y]=nodePos(z,s,w); const k=z+'-'+s; const un=stageUnlocked(z,s); const st=S.prog.stages[k]; const isCur=cur&&cur[0]===z&&cur[1]===s;
      nh+=`<button class="mnode ${s===5?'boss':''} ${un?'':'lock'} ${isCur?'cur':''}" style="left:${x+(sc.clientWidth-w)/2}px;top:${y}px" ${un?act(()=>stageCard(z,s)):''}>${s===5?ico('skull'):s}<span class="st">${[1,2,3].map(i=>st&&st.stars>=i?'★':'<i>★</i>').join('')}</span></button>`; } }
  $('mapNodes').innerHTML=nh;
}

// Telegram's script loads async: wait a moment for initData inside Telegram
function netWaitTG(){ const inTG=/tgWebApp/.test(location.hash+location.search); if(!inTG) return Promise.resolve(); return new Promise(r=>{ let n=0; const t=setInterval(()=>{ if((window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData)||++n>30){ clearInterval(t); r(); } },100); }); }
function netBoot(){
  if(!window.EVNet) return;

    .then(r=>{ NET.ok=!!(r&&r.ok); NET.me=r&&r.me||null; NET.tg=!!(r&&r.telegram); NET.err=r&&r.error||''; if(!NET.ok) return null; return EVNet.save.pull(netWire(S)); })
    .then(p=>{ if(p&&p.ok&&p.action==='use_server') applyCloud(p.data); })

function netProgress(d){ d=d||{}; const h=d.hero||{}; const st=d.prog&&d.prog.stages||{}; let stars=0; for(const k in st) stars+=st[k].stars||0; return {lvl:h.lvl||1,stages:Object.keys(st).length,stars,best:d.endless&&d.endless.best||0}; }
// more-progressed copy wins; ambiguous → ask the player in-style (only on the title screen; mid-game we keep the local copy)
function netConflict(srv,loc){
  const a=netProgress(srv.data), b=netProgress(loc);
  const sGe=a.lvl>=b.lvl&&a.stages>=b.stages&&a.stars>=b.stars, lGe=b.lvl>=a.lvl&&b.stages>=a.stages&&b.stars>=a.stars;
  const same=sGe&&lGe;
  if(sGe&&!same) return G.mode==='title'||G.mode==='boot'?'server':'local';
  if(lGe&&!same) return 'local';
  if(G.mode!=='title'&&G.mode!=='boot') return 'local';
  return new Promise(res=>{
    const when=srv.updatedAt?new Date(srv.updatedAt).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
    const card=(t,p,extra)=>`<div class="card" style="flex:1;min-width:150px"><h4>${t}</h4><div>Уровень <b>${p.lvl}</b> · этапов <b>${p.stages}</b> · звёзд <b>${p.stars}</b></div><div class="muted">Бездна: этаж ${p.best}${extra?' · '+extra:''}</div></div>`;
    openPanel('offline',{html:`<p class="dcap">Летописцы нашли две разные летописи вашего пути. Какую хранить дальше? Другая будет забыта.</p>

      <div class="row" style="gap:8px;margin-top:8px"><button class="btn leather" style="flex:1" ${act(()=>{ closePanel(); res('server'); })}>Взять из облака</button><button class="btn woodb" style="flex:1" ${act(()=>{ closePanel(); res('local'); })}>Оставить эту</button></div>`});

function runEnd(win,reason,keep){
  if(G.mode==='raid'&&PVP){ pvpEnd(reason==='Вы отступили'?'retreat':'dead'); return; }
  if(G.mode==='raid'){ raidEnd(false,reason||'Герой пал'); return; }

  if(G.mode==='abyss'){ abyssEnd(reason||'Вы пали'); return; }
  const r=G.run, I=r.info; G.mode='result';
  let stars=0, starTxt='';
  if(win){ stars=1+(r.t<=I.par?1:0)+(r.minHp>=.35?1:0); starTxt=`${r.t<=I.par?'★ быстро':'☆ медленно'} · ${r.minHp>=.35?'★ стойко':'☆ было опасно'}`;
    const prev=S.prog.stages[I.key]; const first=!prev;
    S.prog.stages[I.key]={stars:Math.max(stars,prev?prev.stars:0),best:Math.min(r.t,prev?prev.best:1e9)};
    if(first){ const bonus=Math.round(60*F(I.lvl)*(I.s===5?4:1)); S.res.gold+=bonus; r.gold+=bonus; if(I.s===5){ S.res.ess+=10*I.z; } if(I.z>S.prog.zone&&I.s===5) S.prog.zone=I.z+1; }
    ev('stage',{key:I.key,nopot:r.pots===0,first,stars}); AU.sfx('win'); track('stage_finish',I.key);
  } else if(!keep){ const lost=Math.round(r.gold*.3); S.res.gold=Math.max(0,S.res.gold-lost); r.lost=lost; }
  if(!win) track(keep?'stage_leave':'stage_fail',I.key);
  compRunEnd(win); questCheck(); saveGame(true);
  const xp=S.hero.lvl>r.startLvl?'+'+(S.hero.lvl-r.startLvl)+' ур.':'';
  const lines=[`${ico('clock')} Время: <b>${Math.floor(r.t/60)}:${String(Math.floor(r.t%60)).padStart(2,'0')}</b>`,`${ico('skull')} Врагов: <b>${r.kills}</b>`,`${ico('gold')} Золото: <b>${fmt(r.gold)}</b>${r.lost?` <span class="r4">(-${r.lost})</span>`:''}`,`${ico('bag')} Предметов: <b>${r.items.length}</b>`];
  for(const k in r.mats) lines.push(`${ico(RES_IC[k])} ${RES_NAME[k]}: <b>${r.mats[k]}</b>`); if(xp) lines.push(`${ico('star')} Уровень: <b>${xp}</b>`);
  if(r.syn) lines.push(`${ico('spark')} Синергий: <b>${r.syn}</b>`); if(r.puzzle) lines.push(`${ico('key')} Загадка: <b>решена</b>`); if(r.compXp) lines.push(`${ico('helm')} ${COMPANIONS[r.compXp.id].n}: <b>+${r.compXp.xp} оп.${r.compXp.ups?' · +'+r.compXp.ups+' ур.':''}</b>`);
  const next=I.s<5?[I.z,I.s+1]:I.z<6?[I.z+1,1]:null;
  const btns=[['В деревню',()=>{ show('res',false); fadeTo(()=>enterVillage()); }, 'woodb']];
  if(win&&next&&stageUnlocked(next[0],next[1])&&!(I.s===5)) btns.push(['Дальше ▸',()=>{ show('res',false); startStage(next[0],next[1]); }]);
  if(!win) btns.push(['Ещё раз',()=>{ show('res',false); startStage(I.z,I.s); }]);
  later(0,()=>{}); setTimeout(()=>showResults({title:win?(I.s===5?'Владыка повержен!':'Победа!'):'Отступление',sub:win?I.name:(reason||'Вы пали в бою'),stars:win?stars:undefined,starTxt,lines,items:r.items,btns}),win?900:300);
  if(win&&I.key==='6-5') setTimeout(()=>banner('Конец первой главы','Бездна открыта навсегда'),1200);
}

// ---------- bot (balance testing) ----------
function botInput(){
  const P=G.P; let tx=null,tz=null,atk=false;
  if(G.mode==='raid') return PVP?pvpBotInput():raidBotInput();
  if(!W||W.kind==='village'||!W.obj) return {mx:0,mz:0,atk:false};
  G._bs=G._bs||{x:0,z:0,t:0,esc:0,ex:0,ez:0}; const bs=G._bs; if(Math.hypot(P.x-bs.x,P.z-bs.z)>1.2){ bs.x=P.x; bs.z=P.z; bs.t=G.time; } else if(G.time-bs.t>4&&bs.esc<=0){ bs.esc=1.2; const a=rand(TAU); bs.ex=Math.sin(a); bs.ez=Math.cos(a); bs.t=G.time; }
  if(bs.esc>0){ bs.esc-=1/30; return {mx:bs.ex,mz:bs.ez,atk:true}; }
  let e=nearestEnemy(P.x,P.z,40);
  const tot=W.objs.find(o=>o.alive&&o.kind==='totem'&&Math.hypot(o.x-P.x,o.z-P.z)<14); if(tot&&(!e||dist(e,P)>3.5)) e=null;
  if(tot&&!e){ const d=dist(tot,P); if(d>2.2){ tx=tot.x; tz=tot.z; } atk=d<4; }
  // dodge telegraphs: if standing inside an active red decal near end -> roll away
  if(P.rollCd<=0&&P.state!=='roll'){ for(const w of G.waves){ if(w.team==='e'&&Math.abs(Math.hypot(P.x-w.x,P.z-w.z)-w.r)<2.2){ dodge(); break; } } }
  if(P.hp<P.maxHp*.38&&S.cons.potion>0) drinkPotion();
  if(G.parryWin&&P.rollCd<=0&&G.parryWin.t<.4&&dist(G.parryWin.e,P)<9) dodge();
  if(G.botSkills!==false){ for(const k of ['s1','s2','s3']) if(e&&dist(e,P)<6&&P.cds[k]<=0&&skillRank(k)>0&&Math.random()<.05) useSkill(k); if(P.ember>=100&&e&&dist(e,P)<8) useSkill('ult'); }
  if(e){ const d=dist(e,P); const ranged=PS.cls==='bow'||PS.cls==='staff'; const want=ranged?7:1.6+e.r; if(d>want){ tx=e.x; tz=e.z; } else if(ranged&&d<3.5){ tx=P.x-(e.x-P.x); tz=P.z-(e.z-P.z); } atk=d<(ranged?13:3+e.r); }
  else if(tx===null){ // objective
    const o=W.objs.find(o=>o.alive&&((o.kind==='totem')||(o.kind==='cage'&&!W.freed)));
    if(o){ tx=o.x; tz=o.z; atk=dist(o,P)<3; }
    else if(W.obj.type==='survive'&&!W.obj.done){ tx=W.arena.x; tz=W.arena.z+3; }
    else if(W.obj.type==='escort'&&W.cart&&!W.cart.arrived){ tx=W.cart.x; tz=W.cart.z+2; }
    else if(W.obj.type==='boss'&&!W.bossStarted){ tx=W.arenaNode.x; tz=W.arenaNode.z; }
    else { const camp=W.camps.find(c=>c.members.some(m=>m.alive)); if(camp){ tx=camp.x; tz=camp.z; } else if(W.portal&&W.portal.on){ tx=W.portal.x; tz=W.portal.z; } }
  }
  // dodge out of decals targeted at me
  let mx=0,mz=0; if(tx!==null){ const dx=tx-P.x,dz=tz-P.z,d=Math.hypot(dx,dz); if(d>.6){ mx=dx/d; mz=dz/d; } }
  // navigate path: if far along path, follow segment centerline direction
  if(tx!==null&&W.walk&&!walkable(P.x+mx*1.5,P.z+mz*1.5,.2)){ let best=null,bd=1e9; for(const n of W.walk.nodes){ if(n.side) continue; const d=Math.hypot(n.x-tx,n.z-tz)+Math.hypot(n.x-P.x,n.z-P.z)*.2; if(Math.hypot(n.x-P.x,n.z-P.z)>2&&d<bd){bd=d;best=n;} } if(best){ const dx=best.x-P.x,dz=best.z-P.z,d=Math.hypot(dx,dz); mx=dx/d; mz=dz/d; } }
  G.input.atk=atk; return {mx,mz,atk};
}

function cosPct(t){ const ids=Object.keys(COSM).filter(k=>(!t||COSM[k].t===t)&&COSM[k].src!=='free'); const n=ids.filter(cosOwned).length; return {n,of:ids.length,p:Math.round(n/Math.max(1,ids.length)*100)}; }
const COS_MAT={};
function cosMat(tint){ const k=tint[0]+'_'+tint[1]; if(!COS_MAT[k]){ COS_MAT[k]=toonMat(tint[0],tint[1]); if(typeof AS_TINT!=='undefined') AS_TINT.set(COS_MAT[k],tint); } return COS_MAT[k]; }
// glow ids are registered as manifest glow colours, so the real weapon model glows too
function cosGlowKey(){ const g=COSM[cosEquipped('glow')]; const sk=COSM[cosEquipped('skin')]; const col=g&&g.src!=='free'?g.c:sk&&sk.glow; if(!col) return null; const key='cos_'+col.replace('#',''); try{ if(window.EV_MANIFEST&&EV_MANIFEST.glow&&!EV_MANIFEST.glow[key]) EV_MANIFEST.glow[key]=col; if(window.EVAssets&&EVAssets.manifest&&EVAssets.manifest.glow&&!EVAssets.manifest.glow[key]) EVAssets.manifest.glow[key]=col; }catch(e){} return key; }
function cosApply(){ const P=G.P; if(!P) return; const sk=COSM[cosEquipped('skin')]; P.skinMat=sk&&sk.tint?cosMat(sk.tint):null; if(P.rig&&P.rig.actor){ P.rig.actor._m=null; }
  try{ refreshPlayer(false); }catch(e){} cosApplyPets(); hudFrame(); }
function cosApplyPets(){ const C=COSM[cosEquipped('pet')]; for(const p of G.pets||[]){ const a=p.rig&&p.rig.actor; if(a){ try{ a.setTint(C&&C.tint?C.tint[0]:null,C&&C.tint?C.tint[1]:0); }catch(e){} continue; } const m=C&&C.tint?cosMat(C.tint):MT; p.rig.root.traverse(o=>{ if(o.isMesh&&(o.material===MT||o.material&&o.material.userData&&o.material.userData.cos)) { o.material=m; } }); if(m!==MT) m.userData.cos=1; } }
function hudFrame(){ const f=COSM[cosEquipped('frame')]; const el=$('hPort'); if(el) el.style.setProperty('--fr',f&&f.src!=='free'?f.c:''); if(el) el.classList.toggle('framed',!!(f&&f.src!=='free')); }

function cosSrcTxt(id){ const C=COSM[id]; if(cosOwned(id)) return ''; switch(C.src){ case 'pass': { const T=passTiers().find(t=>(t.free&&t.free.cosmetic===id)||(t.premium&&t.premium.cosmetic===id)); return `Путь Угля${T?' · ур. '+T.tier:''}${C.prem?' · премиум':''}`; }

    case 'cal': return 'Календарь входа'; case 'event': return 'Событие'; case 'boss': return C.boss?`Победите босса ${C.boss}`:`Бездна, этаж ${C.abyss}`; case 'sparks': return `${C.price} искр`; case 'friend': return `Пригласите ${C.need} ${plural(C.need,'друга','друзей','друзей')}`; }
