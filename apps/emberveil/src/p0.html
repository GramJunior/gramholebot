.sitem{border-radius:14px;padding:12px 8px 9px;background:radial-gradient(ellipse at 50% 22%,rgba(255,200,110,.18),#100b08 80%);box-shadow:inset 0 0 0 1.5px rgba(234,180,90,.5),0 3px 0 rgba(0,0,0,.5)}
.sitem .sic{width:68px;height:68px;font-size:36px;background:radial-gradient(circle at 40% 32%,#3a2a1e,#0e0a07 70%);box-shadow:0 0 0 2px #0a0604,0 0 0 4px #b57d27,0 0 22px rgba(255,170,60,.35)}
.sitem b{font-size:15.5px}.sitem small{font-size:12px}
/* popover шансов */
details.rates>summary{list-style:none;display:inline-flex;align-items:center;gap:4px;font-family:var(--sc);font-size:13px;color:var(--g1);padding:2px 9px;border-radius:9px;background:rgba(0,0,0,.4);box-shadow:inset 0 0 0 1px rgba(234,180,90,.35)}
details.rates>summary::-webkit-details-marker{display:none}
details.rates>summary::before{content:"%";font-weight:800}
details.rates[open]>div,details.rates[open]>small{animation:vRise .25s ease-out}
.chestc .rtab span{font-size:12.5px}

/* ---------- открытие сундука: лучи, вспышка цвета редкости, карты переворачиваются по одной ---------- */
#chestW{background:radial-gradient(ellipse at 50% 38%,rgba(50,26,12,.97),rgba(4,2,1,.995) 70%)}
#chestW .chrays{opacity:0;background:repeating-conic-gradient(from 0deg,var(--c) 0deg 5deg,transparent 5deg 15deg)}
#chestW.open .chrays{opacity:.6;transition:opacity .4s}
#chestW .chrays2{position:absolute;left:50%;top:34%;width:120vmax;height:120vmax;margin:-60vmax 0 0 -60vmax;opacity:0;background:radial-gradient(circle,var(--bc,#ffd27a) 0%,transparent 40%);transition:opacity .5s;pointer-events:none}
#chestW.open .chrays2{opacity:.55}
#chestW .chtitle{font-size:calc(30px*var(--k));letter-spacing:.04em;text-shadow:0 0 18px currentColor,0 3px 0 #000}
#chestW .chloot{gap:10px;perspective:800px}
#chestW .lc{width:calc(82px*var(--k));animation:none;opacity:0;transform:translateY(-30px) scale(.6);transition:opacity .25s,transform .45s var(--ease)}
#chestW .lc.in{opacity:1;transform:none}
#chestW .lc .flip{position:relative;width:100%;aspect-ratio:1;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.3,.5,1)}
#chestW .lc.in .flip{transform:rotateY(180deg)}
#chestW .lc .fb,#chestW .lc .ff{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px}
#chestW .lc .fb{background:radial-gradient(circle at 50% 40%,#5a3a1e,#1a0f08);box-shadow:inset 0 0 0 2px #e6aa48,inset 0 0 0 4px #2a1604;display:grid;place-items:center;color:var(--g1);font-size:30px}
#chestW .lc .ff{transform:rotateY(180deg)}
#chestW .lc .ff .it,#chestW .lc .ff .supi{width:100%;height:100%}
#chestW .lc small{font-size:11.5px;margin-top:3px;text-shadow:0 1px 2px #000}
#chestW .lc.r3 .ff,#chestW .lc.r4 .ff{box-shadow:0 0 22px var(--lcc,#ffb04a)}
#chestW .lc.r3{--lcc:#ff9d2e}#chestW .lc.r4{--lcc:#ff4b3a}#chestW .lc.r2{--lcc:#b86eff}
#chestW .lc.sup b{margin-top:-20px;font-size:14px;position:relative}
.legban{position:absolute;left:50%;top:9%;transform:translateX(-50%);z-index:5;pointer-events:none;font-family:var(--disp);font-size:calc(38px*var(--k));letter-spacing:.06em;white-space:nowrap;
  color:#fff1c0;text-shadow:0 0 22px var(--bc,#ff9d2e),0 0 44px var(--bc,#ff9d2e),0 3px 0 #4a1a04;animation:vLeg 2.4s var(--ease) both}
.legban small{display:block;text-align:center;font-family:var(--sc);font-size:14px;letter-spacing:.3em;color:var(--g1)}
@keyframes vLeg{0%{opacity:0;transform:translateX(-50%) scale(2.6)}14%{opacity:1;transform:translateX(-50%) scale(.95)}22%{transform:translateX(-50%) scale(1.04)}30%{transform:translateX(-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-10px)}}
html.land.short .legban{top:4%;font-size:30px}

/* ---------- Дары очага: календарь 28 дней ---------- */
.calTop{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.calTop .ttl{flex:1;min-width:0}
.calTop .ttl b{font-family:var(--disp);font-size:22px;color:var(--g1);text-shadow:0 2px 0 #000}
.calTop .ttl small{display:block;font-size:13px;color:var(--tx2);line-height:1.25}
.calTop .btn.big{min-width:190px;min-height:52px}
.calGrid{grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.calD{min-height:calc(66px*var(--k));border-radius:11px;gap:1px;padding:14px 2px 4px;font-size:13px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#2e231b,#130e0b 80%);box-shadow:inset 0 0 0 1px rgba(234,180,90,.28),0 2px 0 rgba(0,0,0,.5)}
.calD .dn{left:6px;top:3px;font-size:12px;color:var(--tx3);font-weight:800}
.calD .rchip{background:none;box-shadow:none;font-size:16px;padding:0;flex-direction:column;gap:0;line-height:1.05}
.calD .rchip .ico{font-size:26px}
.calD .rchip>span{font-family:var(--disp);font-size:16px}
.calD .cosic{width:36px;height:36px;flex-basis:36px}
.calD>b{font-family:var(--disp);font-size:15px;color:var(--tx)}
.calD.big{background:radial-gradient(ellipse at 50% 30%,#6a3a12,#1e120a 80%);box-shadow:inset 0 0 0 2px #ffcf6e,0 0 14px rgba(255,170,60,.45),0 2px 0 rgba(0,0,0,.5)}
.calD.big::before{content:"";position:absolute;left:50%;top:50%;width:200%;aspect-ratio:1;transform:translate(-50%,-50%);background:repeating-conic-gradient(rgba(255,210,120,.18) 0 8deg,transparent 8deg 22deg);animation:spin 18s linear infinite;pointer-events:none}
.calD.big .dn{color:var(--g1)}
.calD.today{background:radial-gradient(ellipse at 50% 30%,#7a4a14,#2a1608 80%);box-shadow:inset 0 0 0 2.5px #fff0b0,0 0 0 2px #ff9a2a,0 0 22px #ff8a2b;animation:vToday 1.4s ease-in-out infinite;z-index:1}
.calD.today .dn{color:#fff}
@keyframes vToday{50%{box-shadow:inset 0 0 0 2.5px #fff0b0,0 0 0 2px #ffb04a,0 0 34px #ffa040;transform:scale(1.04)}}
.calD.done{opacity:1;filter:saturate(.35) brightness(.62)}
.calD .ck{position:absolute;inset:0;display:grid;place-items:center;color:transparent;font-style:normal}
.calD.done .ck::after{content:"ПОЛУЧЕНО";position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-18deg);font-family:var(--sc);font-weight:800;font-size:10.5px;letter-spacing:.06em;color:#ffcf8a;padding:1px 5px;border:2px solid #ffcf8a;border-radius:5px;background:rgba(40,20,8,.55);filter:none;opacity:.95}

.calD.wk-end{box-shadow:inset 0 0 0 1px rgba(234,180,90,.45),0 2px 0 rgba(0,0,0,.5)}

/* ---------- Колесо Угля: большое, по центру ---------- */
.wheelPane{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:18px;min-height:100%}
.wheelBox{position:relative;width:var(--wd,300px);height:var(--wd,300px);justify-self:center}
.wheelBox::before{content:"";position:absolute;inset:-10%;border-radius:50%;background:radial-gradient(circle,rgba(255,160,50,.35),transparent 66%);animation:vPulseGlow 2.4s ease-in-out infinite;pointer-events:none}

.wheelBox svg.wh{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 8px 14px rgba(0,0,0,.7))}
