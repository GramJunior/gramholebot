<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#03080b">
<meta name="description" content="ОТГОЛОСОК — атмосферный сюжетный платформер о девочке, которая видит мир только звуком.">
<title>Отголосок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js" async></script>
<style>
:root{
  --bg:#03080b; --ink:#e9f3f1; --dim:#8fa9a6; --dim2:#58706d; --acc:#86e6da; --acc2:#f2e3c9;
  --line:rgba(200,240,235,.14); --card:rgba(10,24,28,.55);
  --serif:'Cormorant Garamond','Cormorant',Georgia,'Times New Roman',serif;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
}
body[data-act="1"]{--acc:#f2bd73;--dim:#b39c80;--dim2:#7a6650;--line:rgba(250,220,180,.14);--card:rgba(30,20,10,.55);--bg:#0a0604}
body[data-act="2"]{--acc:#c9b8ff;--dim:#a49dbf;--dim2:#6c6688;--line:rgba(220,210,255,.14);--card:rgba(18,15,32,.55);--bg:#06050c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.hidden{display:none!important}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hudTop{position:absolute;top:calc(var(--st) + 10px);left:calc(var(--sl) + 14px);right:calc(var(--sr) + 14px);display:flex;align-items:flex-start;gap:10px}
#lvlName{font-family:var(--serif);font-size:15px;letter-spacing:.08em;color:var(--dim);opacity:0;transition:opacity 1.2s;flex:1;line-height:1.25}
#lvlName b{display:block;font-weight:500;font-size:20px;color:var(--ink);letter-spacing:.04em}
#memHud{font-family:var(--serif);font-size:16px;color:var(--dim);display:flex;align-items:center;gap:6px;padding-top:6px}
#memHud i{width:7px;height:7px;transform:rotate(45deg);border:1px solid var(--acc);display:inline-block;opacity:.8}
#memHud i.on{background:var(--acc);box-shadow:0 0 8px var(--acc)}
.hbtn{pointer-events:auto;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--ink);opacity:.8;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.hbtn svg{width:18px;height:18px}
#toast{position:absolute;left:50%;top:calc(var(--st) + 64px);transform:translateX(-50%);width:min(560px,88vw);text-align:center;
  font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.4;color:var(--ink);opacity:0;transition:opacity .9s;
  text-shadow:0 0 14px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.9)}
#toast small{display:block;font-style:normal;font-family:var(--sans);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--acc);margin-bottom:6px;opacity:.85}

/* ---------- touch controls ---------- */
#touch{position:fixed;left:0;right:0;bottom:0;height:calc(176px + var(--sb));z-index:6;pointer-events:none}
#touch .tb{position:absolute;pointer-events:auto;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--line);
  color:var(--ink);opacity:.55;transition:opacity .12s,transform .12s,background .12s;touch-action:none}
#touch .tb.on{opacity:.95;transform:scale(.94);background:radial-gradient(circle,color-mix(in srgb,var(--acc) 30%,transparent),rgba(255,255,255,.03))}
#touch .tb svg{width:42%;height:42%}
#tL{left:calc(var(--sl) + 14px);bottom:calc(var(--sb) + 26px);width:80px;height:80px}
#tR{left:calc(var(--sl) + 104px);bottom:calc(var(--sb) + 26px);width:80px;height:80px}
#tJ{right:calc(var(--sr) + 16px);bottom:calc(var(--sb) + 22px);width:92px;height:92px}
#tE{right:calc(var(--sr) + 118px);bottom:calc(var(--sb) + 58px);width:74px;height:74px}
#tE::after{content:"";position:absolute;inset:-5px;border-radius:50%;
  background:conic-gradient(var(--acc) calc(var(--cd,1)*360deg),transparent 0);
  -webkit-mask:radial-gradient(circle,transparent 62%,#000 63%,#000 67%,transparent 68%);mask:radial-gradient(circle,transparent 62%,#000 63%,#000 67%,transparent 68%);opacity:.7}

/* ---------- screens ---------- */
.scr{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(var(--st) + 20px) calc(var(--sr) + 20px) calc(var(--sb) + 20px) calc(var(--sl) + 20px);
  animation:scrIn .7s ease both;overflow-y:auto;touch-action:pan-y}
@keyframes scrIn{from{opacity:0}to{opacity:1}}
.veil{background:radial-gradient(120% 90% at 50% 40%,rgba(0,0,0,.35),rgba(0,0,0,.82))}
.title{font-family:var(--serif);font-weight:500;font-size:min(10vw,84px);white-space:nowrap;letter-spacing:.16em;margin-right:-.16em;
  text-align:center;line-height:1;color:var(--ink);text-shadow:0 0 30px color-mix(in srgb,var(--acc) 45%,transparent)}
.title span{display:inline-block;animation:letter 6s ease-in-out infinite}
@keyframes letter{0%,100%{opacity:.92;filter:blur(0)}50%{opacity:.55;filter:blur(1px)}}
.sub{font-family:var(--serif);font-style:italic;font-size:clamp(16px,4.6vw,21px);color:var(--dim);margin-top:14px;text-align:center;letter-spacing:.03em}
.menu{display:flex;flex-direction:column;gap:2px;margin-top:clamp(22px,5vh,48px);width:min(300px,80vw)}
.mbtn{font-family:var(--serif);font-size:22px;letter-spacing:.06em;padding:9px 10px;color:var(--ink);opacity:.82;
  border-top:1px solid transparent;border-bottom:1px solid transparent;transition:opacity .2s,letter-spacing .3s,border-color .3s;position:relative}
.mbtn:hover,.mbtn:focus-visible{opacity:1;letter-spacing:.1em;border-color:var(--line);outline:none}
.mbtn.small{font-size:17px;opacity:.6}
.mbtn:disabled{opacity:.25;cursor:default}
.foot{position:absolute;bottom:calc(var(--sb) + 14px);left:0;right:0;text-align:center;font-size:11px;letter-spacing:.2em;color:var(--dim2);text-transform:uppercase}
.h2{font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:.12em;text-align:center}
.cap{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--acc);opacity:.85;text-align:center}
.panel{width:min(560px,100%);margin-top:18px}
.back{margin-top:22px}
.topbar{width:min(560px,100%);display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}

/* acts */
.acts{display:flex;flex-direction:column;gap:14px;width:min(560px,100%);margin-top:16px}
.act{border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;background:var(--card);position:relative;overflow:hidden}
.act::before{content:"";position:absolute;inset:0;background:var(--actbg);opacity:.5;pointer-events:none}
.act h3{font-family:var(--serif);font-weight:500;font-size:22px;letter-spacing:.06em;position:relative}
.act h3 small{font-family:var(--sans);font-size:10px;letter-spacing:.3em;color:var(--dim);display:block;margin-bottom:2px;font-weight:600}
.act .meta{position:absolute;right:14px;top:16px;font-family:var(--serif);font-size:15px;color:var(--dim)}
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px;position:relative}
.lv{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:rgba(0,0,0,.25);font-family:var(--serif);font-size:20px;transition:border-color .2s,background .2s}
.lv:hover{border-color:var(--acc)}
.lv .d{display:flex;gap:4px}
.lv .d i{width:5px;height:5px;transform:rotate(45deg);border:1px solid var(--dim);display:block}
.lv .d i.on{background:var(--acc);border-color:var(--acc)}
.lv.done{border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.lv.locked{opacity:.28;cursor:default}
.lv.locked:hover{border-color:var(--line)}
.lvname{font-family:var(--serif);font-style:italic;color:var(--dim);font-size:15px;margin-top:8px;min-height:20px;position:relative}

/* settings */
.row{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--line);font-family:var(--serif);font-size:20px;gap:14px}
.row input[type=range]{width:46%;accent-color:var(--acc)}
.tog{width:52px;height:28px;border-radius:14px;border:1px solid var(--line);position:relative;background:rgba(255,255,255,.04);flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:transform .25s,background .25s}
.tog.on::after{transform:translateX(24px);background:var(--acc);box-shadow:0 0 10px var(--acc)}
.danger{color:#e7a39a}

/* journal */
.jlist{width:min(560px,100%);margin-top:10px}
.jact{font-family:var(--serif);font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--acc);margin:20px 0 6px;opacity:.85}
.jitem{font-family:var(--serif);font-size:18px;line-height:1.45;padding:10px 2px 10px 18px;border-bottom:1px solid var(--line);position:relative;color:var(--ink)}
.jitem::before{content:"";position:absolute;left:2px;top:19px;width:6px;height:6px;transform:rotate(45deg);background:var(--acc);box-shadow:0 0 8px var(--acc)}
.jitem.no{color:var(--dim2);font-style:italic}
.jitem.no::before{background:none;border:1px solid var(--dim2);box-shadow:none}
.jitem small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.2em;color:var(--dim2);margin-top:2px;text-transform:uppercase}

/* story */
#scrStory{background:rgba(0,0,0,.72);cursor:pointer}
#storyText{width:min(560px,100%);text-align:center;font-family:var(--serif);font-size:clamp(20px,5.4vw,27px);line-height:1.5;min-height:40vh;display:flex;flex-direction:column;justify-content:center;gap:16px}
#storyText p{opacity:0;transform:translateY(8px);transition:opacity 1.6s ease,transform 1.6s ease}
#storyText p.in{opacity:1;transform:none}
#storyText p.old{opacity:.38}
#storyText p.voice{font-style:italic;color:var(--acc)}
#storyText p.big{font-size:clamp(34px,10vw,56px);letter-spacing:.14em;font-weight:500}
#storyText p.cap2{font-family:var(--sans);font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:var(--acc)}
#storyText p.gift{font-family:var(--sans);font-size:13px;letter-spacing:.12em;color:var(--acc);border:1px solid var(--line);border-radius:30px;padding:8px 16px;align-self:center}
#storyHint{position:absolute;bottom:calc(var(--sb) + 26px);left:0;right:0;text-align:center;font-size:11px;letter-spacing:.3em;color:var(--dim2);text-transform:uppercase;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
#storySkip{position:absolute;top:calc(var(--st) + 12px);right:calc(var(--sr) + 14px);font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--dim);padding:10px}

/* complete card */
#scrDone{background:radial-gradient(80% 60% at 50% 50%,rgba(0,0,0,.25),rgba(0,0,0,.7))}
.card{text-align:center;max-width:520px}
.card .voice{font-family:var(--serif);font-style:italic;font-size:clamp(22px,6vw,30px);color:var(--acc);margin:18px 0 10px;text-shadow:0 0 18px color-mix(in srgb,var(--acc) 40%,transparent)}
.card .stats{font-family:var(--serif);font-size:17px;color:var(--dim);margin-top:8px}
.card .mbtn{margin-top:22px}

/* credits */
#credits{width:min(520px,100%);text-align:center;font-family:var(--serif);font-size:19px;line-height:1.7;color:var(--ink)}
#credits h4{font-family:var(--sans);font-size:10px;letter-spacing:.35em;text-transform:uppercase;color:var(--acc);margin-top:26px;font-weight:600}
#credits .big{font-size:40px;letter-spacing:.2em;font-weight:500;margin-right:-.2em}

#fade{position:fixed;inset:0;background:#000;pointer-events:none;z-index:20;opacity:1;transition:opacity .6s ease}
#rot{display:none}
@media (prefers-reduced-motion:reduce){.title span{animation:none}}
</style>
</head>
<body data-act="0">
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div id="hudTop">
    <div id="lvlName"></div>
    <div id="memHud"></div>
    <button class="hbtn" id="btnMute" aria-label="Звук">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path id="muteWave" d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/><path id="muteX" class="hidden" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    </button>
    <button class="hbtn" id="btnPause" aria-label="Пауза">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.2"/></svg>
    </button>
  </div>
  <div id="toast"></div>
</div>

<div id="touch" class="hidden">
  <div class="tb" id="tL" data-k="l"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></div>
  <div class="tb" id="tR" data-k="r"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></div>
  <div class="tb" id="tE" data-k="e"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="2.2" fill="currentColor"/><circle cx="12" cy="12" r="6" opacity=".75"/><circle cx="12" cy="12" r="10" opacity=".4"/></svg></div>
  <div class="tb" id="tJ" data-k="j"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg></div>
</div>

<section id="scrTitle" class="scr hidden" style="justify-content:flex-start;padding-top:calc(var(--st) + 12vh)">
  <div class="title" id="titleWord"></div>
  <div class="sub">история, рассказанная эхом</div>
  <div class="menu">
    <button class="mbtn" id="bContinue">Продолжить</button>
    <button class="mbtn" id="bNew">Новая история</button>
    <button class="mbtn small" id="bActs">Главы</button>
    <button class="mbtn small" id="bJournal">Дневник</button>

<section id="scrActs" class="scr veil hidden">

  <div class="acts" id="actsList"></div>
  <button class="mbtn small back" data-back>Назад</button>
</section>

<section id="scrPause" class="scr veil hidden">
  <div class="cap" id="pauseCap">пауза</div>
  <div class="h2" id="pauseTitle">Тишина</div>
  <div class="menu">
    <button class="mbtn" id="pResume">Продолжить</button>
    <button class="mbtn small" id="pRestart">Начать главу заново</button>
    <button class="mbtn small" id="pActs">Главы</button>
    <button class="mbtn small" id="pJournal">Дневник</button>
    <button class="mbtn small" id="pSettings">Настройки</button>
    <button class="mbtn small" id="pMenu">В главное меню</button>
  </div>
</section>

<section id="scrSettings" class="scr veil hidden">
  <div class="cap">настройки</div>
  <div class="h2">Слух</div>
  <div class="panel">
    <label class="row">Звуки<input type="range" min="0" max="100" id="sSfx"></label>
    <label class="row">Музыка и эмбиент<input type="range" min="0" max="100" id="sMus"></label>
    <div class="row">Тряска экрана<button class="tog" id="sShake" aria-label="Тряска экрана"></button></div>
    <div class="row">Зерно плёнки<button class="tog" id="sGrain" aria-label="Зерно плёнки"></button></div>
    <div class="row">Подсказки<button class="tog" id="sHints" aria-label="Подсказки"></button></div>
    <div class="row">Сенсорные кнопки<button class="tog" id="sTouch" aria-label="Сенсорные кнопки"></button></div>
    <div class="row"><span>Прогресс</span><button class="mbtn small danger" id="sReset">Стереть</button></div>
  </div>
  <button class="mbtn small back" data-back>Назад</button>
</section>

<section id="scrJournal" class="scr veil hidden" style="justify-content:flex-start">
  <div class="cap" style="margin-top:10px">дневник</div>
  <div class="h2">Воспоминания</div>
  <div class="sub" id="jCount"></div>
  <button class="mbtn small hidden" id="jEpilogue">Эпилог · кассета</button>
  <div class="jlist" id="jList"></div>
  <button class="mbtn small back" data-back style="margin-bottom:20px">Назад</button>
</section>

<section id="scrStory" class="scr hidden">
  <button id="storySkip">пропустить</button>
  <div id="storyText"></div>
  <div id="storyHint">коснись, чтобы продолжить</div>
</section>

<section id="scrDone" class="scr hidden">
  <div class="card">
    <div class="cap" id="dCap">глава пройдена</div>
    <div class="h2" id="dName"></div>
    <div class="voice" id="dVoice"></div>
    <div class="stats" id="dStats"></div>
    <button class="mbtn" id="dNext">Дальше</button>
  </div>
</section>

<section id="scrCredits" class="scr veil hidden">
  <div id="credits"></div>
  <button class="mbtn small back" data-back>Назад</button>
</section>

<div id="fade"></div>

<script>
'use strict';
/*CORE_START*/
/* ===== CORE: tiles, level parsing, player physics (shared with the reachability checker) ===== */
const T = 20;
const PH = {
  G: 1600, JUMP: 480, DJUMP: 420, RUN: 150,
  ACC_G: 1500, DEC_G: 2100, ACC_A: 1050, DEC_A: 520,
  MAXFALL: 560, SLIDE: 85, WJX: 190, WJY: 455, LOCK: 0.13,
  COY: 0.1, BUF: 0.13, CUT: 0.45, W: 10, H: 26,
  UPDRAFT: 2700, UPMAX: 300, WIND: 90
};
// tile codes
const TL = { EMPTY: 0, STONE: 1, LEDGE: 2, GHOST: 3, CRUMB: 4, HAZ: 5, DOOR1: 6, DOOR2: 7 };
const TILE_OF = { '#': 1, '=': 2, '~': 3, 'c': 4, 'x': 5, 'd': 6, 'e': 7 };
const WIND_OF = { '^': 1, '>': 2, '<': 3 };

function parseLevel(map) {
  const H = map.length; let W = 0;
  for (const r of map) W = Math.max(W, r.length);
  const N = W * H;
  const L = {
    W, H, t: new Uint8Array(N), wind: new Uint8Array(N),
    spawn: { x: 2 * T, y: 2 * T }, goal: null, cps: [], mems: [], bells: [], crystals: [],
    enemies: [], movers: [], hints: []
  };
  const at = (x, y) => (map[y] && map[y][x]) || '.';
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const ch = at(x, y), i = y * W + x;
    if (TILE_OF[ch]) { L.t[i] = TILE_OF[ch]; continue; }
    if (WIND_OF[ch]) { L.wind[i] = WIND_OF[ch]; continue; }
    const cx = x * T + T / 2, fy = (y + 1) * T;
    switch (ch) {
      case 'P': L.spawn = { x: cx, y: fy }; break;
      case 'G': L.goal = { x: cx, y: y * T + T / 2, tx: x, ty: y }; break;
      case 'K': L.cps.push({ x: cx, y: fy, tx: x, ty: y, on: false }); break;
      case 'M': L.mems.push({ x: cx, y: y * T + T / 2, idx: L.mems.length, got: false }); break;
      case 'b': case 'n': L.bells.push({ x: cx, y: y * T + T / 2, grp: ch === 'b' ? 6 : 7, tx: x, ty: y }); break;
      case 'C': L.crystals.push({ x: cx, y: y * T + T / 2, tx: x, ty: y, on: false }); break;
      case 'E': L.enemies.push({ x: cx, y: fy }); break;
      case 'H': case 'V': {
        let ex = x, ey = y;
        if (ch === 'H') { for (let k = 1; k < W; k++) { if (at(x + k, y) === 'h') { ex = x + k; break; } if (at(x - k, y) === 'h') { ex = x - k; break; } } }
        else { for (let k = 1; k < H; k++) { if (at(x, y - k) === 'v') { ey = y - k; break; } if (at(x, y + k) === 'v') { ey = y + k; break; } } }
        L.movers.push({ axis: ch === 'H' ? 0 : 1, ax: x * T, ay: y * T, bx: ex * T, by: ey * T, w: 3 * T });
        break;
      }
      default:
        if (ch >= '1' && ch <= '9') L.hints.push({ x: cx, y: y * T, n: +ch - 1 });
    }
  }
  return L;
}

// cls: 0 = free, 1 = solid, 2 = one-way (top only)
function windAt(L, px, py) {
  const tx = Math.floor(px / T), ty = Math.floor(py / T);
  if (tx < 0 || ty < 0 || tx >= L.W || ty >= L.H) return 0;
  return L.wind[ty * L.W + tx];
}

function touchWall(b, s, w) {
  const x = s > 0 ? b.x + PH.W / 2 + 1 : b.x - PH.W / 2 - 1;
  const c = Math.floor(x / T);
  const r0 = Math.floor((b.y - PH.H + 3) / T), r1 = Math.floor((b.y - 3) / T);
  for (let r = r0; r <= r1; r++) if (w.cls(c, r) === 1) return true;
  return false;
}

function newBody(x, y) {
  return { x, y, vx: 0, vy: 0, ground: true, coy: 0, buf: 0, jumping: false, dj: false, lock: 0, wall: 0, face: 1, sliding: false, mover: null, peak: y, bonk: false, ev: [], inWind: 0 };
}

function stepBody(b, inp, w, dt) {
  const ev = b.ev; ev.length = 0;
  b.buf = inp.jp ? PH.BUF : Math.max(0, b.buf - dt);
  const dir = (inp.r ? 1 : 0) - (inp.l ? 1 : 0);
  // wind
  const wk = windAt(w.L, b.x, b.y - PH.H / 2);
  b.inWind = wk;
  let windVX = 0;
  if (wk === 2) windVX = PH.WIND; else if (wk === 3) windVX = -PH.WIND;
  if (b.lock > 0) b.lock -= dt;
  else {
    const tgt = dir * PH.RUN + windVX;
    let acc;
    if (b.ground) acc = dir ? (Math.sign(b.vx) !== dir && b.vx !== 0 ? PH.DEC_G : PH.ACC_G) : PH.DEC_G;
    else acc = (dir || windVX) ? PH.ACC_A : PH.DEC_A;
    if (b.vx < tgt) b.vx = Math.min(tgt, b.vx + acc * dt); else if (b.vx > tgt) b.vx = Math.max(tgt, b.vx - acc * dt);
  }
  if (dir) b.face = dir;
  // variable jump height
  if (b.jumping && b.vy < 0 && !inp.jh) { b.vy *= PH.CUT; b.jumping = false; }
  if (b.vy >= 0) b.jumping = false;
  b.vy += PH.G * dt;
  if (wk === 1) { b.vy -= PH.UPDRAFT * dt; if (b.vy < -PH.UPMAX) b.vy = Math.min(b.vy + 1800 * dt, -PH.UPMAX); b.dj = false; }
  // walls
  b.wall = 0;
  if (!b.ground) { if (touchWall(b, -1, w)) b.wall = -1; else if (touchWall(b, 1, w)) b.wall = 1; }
  b.sliding = !!(b.wall && dir === b.wall && b.vy > 0);
  if (b.sliding) b.vy = Math.min(b.vy, PH.SLIDE);
  if (b.vy > PH.MAXFALL) b.vy = PH.MAXFALL;
  b.coy = b.ground ? PH.COY : Math.max(0, b.coy - dt);
  if (b.buf > 0) {
    if (b.coy > 0) { b.vy = -PH.JUMP; b.coy = 0; b.buf = 0; b.jumping = true; b.ground = false; b.mover = null; ev.push('jump'); }
    else if (b.wall) { b.vy = -PH.WJY; b.vx = -b.wall * PH.WJX; b.lock = PH.LOCK; b.buf = 0; b.jumping = true; b.face = -b.wall; b.dj = false; ev.push('wjump'); }
    else if (w.canDJ && !b.dj) { b.vy = -PH.DJUMP; b.dj = true; b.buf = 0; b.jumping = true; ev.push('djump'); }
  }
  // ride mover
  if (b.ground && b.mover) { b.x += b.mover.dx; b.y += b.mover.dy; }
  const wasGround = b.ground, vyBefore = b.vy;
  moveX(b, b.vx * dt, w);
  moveY(b, b.vy * dt, w);
  if (!b.ground && wasGround) b.peak = b.y;
  if (!b.ground) b.peak = Math.min(b.peak, b.y);
  if (b.ground) { if (!wasGround) { ev.push('land'); b.landV = vyBefore; b.fall = b.y - b.peak; } b.dj = false; b.peak = b.y; }
}

function moveX(b, dx, w) {
  if (!dx) return;
  let nx = b.x + dx;
  const r0 = Math.floor((b.y - PH.H + 0.5) / T), r1 = Math.floor((b.y - 0.5) / T);
  if (dx > 0) {
    const c = Math.floor((nx + PH.W / 2) / T);
    for (let r = r0; r <= r1; r++) if (w.cls(c, r) === 1) { nx = c * T - PH.W / 2 - 0.01; b.vx = 0; break; }
  } else {
    const c = Math.floor((nx - PH.W / 2) / T);
    for (let r = r0; r <= r1; r++) if (w.cls(c, r) === 1) { nx = (c + 1) * T + PH.W / 2 + 0.01; b.vx = 0; break; }
  }
  b.x = nx;
}

function moveY(b, dy, w) {
  b.ground = false; b.bonk = false;
  const c0 = Math.floor((b.x - PH.W / 2 + 0.5) / T), c1 = Math.floor((b.x + PH.W / 2 - 0.5) / T);
  if (dy > 0) {
    const oldB = b.y, newB = b.y + dy;
    let land = Infinity, lm = null;
    const r = Math.floor(newB / T);
    if (r * T >= oldB - 0.01 && r * T <= newB) {
      for (let c = c0; c <= c1; c++) { const k = w.cls(c, r); if (k === 1 || k === 2) { land = r * T; break; } }
    }
    const ms = w.movers;
    if (ms) for (const m of ms) {
      if (b.x + PH.W / 2 > m.x && b.x - PH.W / 2 < m.x + m.w && oldB <= m.y + 1.5 && newB >= m.y - 0.01 && m.y < land) { land = m.y; lm = m; }
    }
    if (land < Infinity) { b.y = land; b.vy = 0; b.ground = true; b.mover = lm; }
    else { b.y = newB; b.mover = null; }
  } else if (dy < 0) {
    const oldT = b.y - PH.H, newT = oldT + dy;
    const r = Math.floor(newT / T);
    if (Math.floor(oldT / T) !== r || true) {
      for (let c = c0; c <= c1; c++) if (w.cls(c, r) === 1 && (r + 1) * T <= oldT + 0.01) { b.y = (r + 1) * T + PH.H + 0.01; b.vy = 0; b.bonk = true; b.jumping = false; b.mover = null; return; }
    }
    b.y += dy; b.mover = null;
  }
}

function hazardHit(b, w) {
  const x0 = Math.floor((b.x - PH.W / 2 + 3) / T), x1 = Math.floor((b.x + PH.W / 2 - 3) / T);
  const y0 = Math.floor((b.y - PH.H + 6) / T), y1 = Math.floor((b.y - 3) / T);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (w.raw(x, y) === TL.HAZ) return true;
  return b.y > w.L.H * T + 40;
}

  else { f1 = { x: -1.9, y: 0 }; f2 = { x: 2.1, y: 0 }; a1 = { x: -2.6, y: -11.8 + breath }; a2 = { x: 2.8, y: -11.8 + breath }; }

  c.quadraticCurveTo(hx - 6.5 - k * 3, hy + 2 + Math.sin(t * 6) * 0.8, hx - 6 - k * 3.5, hy + 4.5 + Math.sin(t * 5) * 0.8);
  c.quadraticCurveTo(hx - 3.2, hy + 2.5, hx - 2, hy + 2.8); c.closePath(); c.fill();

}

function drawScarf(c, pts, col, glow) {
  if (pts.length < 2) return;
  const n = pts.length, L = [], R = [];
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let nx = -(b.y - a.y), ny = b.x - a.x; const d = Math.hypot(nx, ny) || 1; nx /= d; ny /= d;
    const w = (1 - i / n) * 0.95 + 0.22;
    L.push([pts[i].x + nx * w, pts[i].y + ny * w]); R.push([pts[i].x - nx * w, pts[i].y - ny * w]);
  }
  c.beginPath(); c.moveTo(L[0][0], L[0][1]);
  for (let i = 1; i < n; i++) c.lineTo(L[i][0], L[i][1]);
  for (let i = n - 1; i >= 0; i--) c.lineTo(R[i][0], R[i][1]);
  c.closePath(); c.fillStyle = col; c.fill();
}

// ---------- creature («Безгласый») ----------
function drawCreature(c, e, t, pal, lit) {
  c.save(); c.translate(e.x, e.y); c.scale(e.dir, 1);
  const hunt = e.st === 'hunt', bob = Math.sin(t * (hunt ? 6 : 2) + e.seed) * (hunt ? 1.4 : 0.8);
  const lean = hunt ? 3 : 0;
  c.fillStyle = '#010203';
  c.beginPath(); c.moveTo(-7, 0);
  for (let i = 0; i <= 7; i++) { const x = -7 + i * 2; const y = -Math.abs(Math.sin(t * 3 + i * 1.7 + e.seed)) * 3 - (i % 2 ? 2 : 0); c.lineTo(x, y); }

  c.quadraticCurveTo(9 + lean, -34 + bob, 13 + lean, -28 + bob);
  c.quadraticCurveTo(11 + lean, -24 + bob, 7 + lean, -24.5 + bob);

  c.quadraticCurveTo(-9, -12, -7, 0); c.fill();

  c.beginPath(); c.moveTo(4 + lean, -22 + bob); c.quadraticCurveTo(10 + lean, -14, 11 + sw * 3, -2); c.stroke();

  }

}

// ---------- props ----------
function drawBell(c, b, t, pal, topY) {

  c.strokeStyle = '#020304'; c.lineWidth = 1; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.sin(sw) * (b.y - 8 - topY), b.y - 8 - topY); c.stroke();
  c.translate(Math.sin(sw) * (b.y - 8 - topY), b.y - 8 - topY); c.rotate(-sw);

/* ===== GAME: save, runtime, simulation, rendering ===== */
const SKEY = 'otgolosok_save_v1';
function defSave() { return { v: 1, unlocked: 0, done: {}, mem: {}, deaths: 0, cur: 0, intro: false, ending: false, set: { sfx: 0.8, mus: 0.6, shake: true, grain: true, hints: true, touch: null } }; }
function loadSave() {
  try {
    const raw = window.localStorage && localStorage.getItem(SKEY);
    if (raw) { const s = JSON.parse(raw); if (s && s.v === 1) { const d = defSave(); return Object.assign(d, s, { set: Object.assign(d.set, s.set || {}) }); } }
  } catch (e) {}
  return defSave();
}
let SAVE = loadSave();
function persist() { try { localStorage.setItem(SKEY, JSON.stringify(SAVE)); } catch (e) {} }
const memKey = (li, i) => LEVELS[li].id + ':' + i;
const memTotal = () => LEVELS.reduce((a, l) => a + l.mem.length, 0);
const memFound = () => Object.keys(SAVE.mem).length;

const TG = (() => { try { const w = window.Telegram && window.Telegram.WebApp; return w && w.initData ? w : null; } catch (e) { return null; } })();
function haptic(kind) { try { if (TG && TG.HapticFeedback) TG.HapticFeedback.impactOccurred(kind); } catch (e) {} }

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let VW = 390, VH = 844, DPR = 1, SCALE = 1.4, CTRL_H = 0, IS_TOUCH = false;
const LD = 4; // light map downscale (css px per light px)
const lightC = mkCanvas(10, 10), lightG = lightC.getContext('2d');
let vignetteC = null, grainPats = null;
const ECHO_R = 9 * T, ECHO_SPEED = 340, ECHO_CD = 0.95, LIT_TIME = 4.2, CRYSTAL_R = 8.5 * T;

// ---------- runtime construction ----------
function ropeTop(L, b) { for (let y = b.ty - 1; y >= 0; y--) { const t = L.t[y * L.W + b.tx]; if (t === 1) return (y + 1) * T; } return b.y - 3 * T; }
function makeRun(map, li) {
  const L = parseLevel(map), N = L.W * L.H;
  const def = li >= 0 ? LEVELS[li] : { act: 0, hints: [], mem: [], name: '' };
  const R = {
    li, def, L, act: def.act, pal: ACTS[def.act].pal,
    lit: new Float32Array(N), seen: new Uint8Array(N), clit: new Float32Array(N), crumb: new Float32Array(N), door: new Float32Array(N),
    crumbIdx: [], doorIdx: [], doorOpen: { 6: false, 7: false },
    rings: [], noises: [], parts: [], motes: [],
    p: newBody(L.spawn.x, L.spawn.y), cp: { x: L.spawn.x, y: L.spawn.y },
    echoCd: 0, time: 0, dead: 0, done: 0, inv: 0, shake: 0, started: false,
    cam: { x: L.spawn.x, y: L.spawn.y - 40, look: 0 },
    anim: { phase: 0, sx: 1, sy: 1, st: 'idle', echoT: 0 },
    scarf: [],
    enemies: L.enemies.map((e, i) => ({ x: e.x, y: e.y, hx: e.x, hy: e.y, dir: i % 2 ? -1 : 1, st: 'patrol', t: 0, lit: 0, vy: 0, seed: i * 1.7 + 0.3, tx: 0, ty: 0, eye: { x: 0, y: 0 } })),
    movers: L.movers.map(m => Object.assign({}, m, { x: m.ax, y: m.ay, u: 0, dirm: 1, wait: 0.6, dx: 0, dy: 0 })),
    bells: L.bells.map(b => Object.assign({}, b, { lit: 0, glow: 0, swing: 0, cd: 0, topY: 0 })),
    crystals: L.crystals.map(c => Object.assign({}, c, { lit: 0 })),
    cps: L.cps, mems: L.mems, goal: L.goal, hintA: L.hints.map(() => 0),
    chase: def.chase ? { axis: def.chase.axis, speed: def.chase.speed, pos: 0, active: false, delay: 1.4 } : null,
    canDJ: li >= 5, endT: -1, endLight: 0, cache: null, title: li < 0,
  };
  for (const b of R.bells) b.topY = ropeTop(L, b);
  for (let i = 0; i < N; i++) { if (L.t[i] === 4) R.crumbIdx.push(i); if (L.t[i] === 6 || L.t[i] === 7) R.doorIdx.push(i); }
  if (li >= 0) R.mems.forEach((m, i) => { m.got = !!SAVE.mem[memKey(li, i)]; m.had = m.got; });
  R.world = {
    L, canDJ: R.canDJ, movers: R.movers,
    raw(x, y) { if (x < 0 || y < 0 || x >= L.W || y >= L.H) return 0; return L.t[y * L.W + x]; },
    cls(x, y) {
      if (x < 0 || x >= L.W || y < 0) return 1; if (y >= L.H) return 0;
      const i = y * L.W + x;
      switch (L.t[i]) {
        case 1: return 1; case 2: return 2;
        case 3: return (R.lit[i] > 0.001 || R.clit[i] > 0) ? 2 : 0;
        case 4: return R.crumb[i] < 0 ? 0 : 1;
        case 6: case 7: return R.door[i] >= 0.35 ? 0 : 1;
        default: return 0;
      }
    }
  };
  resetScarf(R);
  if (R.chase) resetChase(R);
  // initial reveal around the spawn so the first second is not pitch black
  revealCircle(R, R.p.x, R.p.y - 14, 3.5 * T, 0.6);
  return R;
}
function waveScarf(R) {
  const S = R.scarf, out = [], t = R.time, sp = 1 + Math.min(1, Math.abs(R.p.vx) / PH.RUN) * 1.5;
  for (let i = 0; i < S.length; i++) {
    const a = S[Math.max(0, i - 1)], b = S[Math.min(S.length - 1, i + 1)];
    let nx = -(b.y - a.y), ny = b.x - a.x; const d = Math.hypot(nx, ny) || 1;
    const w = Math.sin(t * 6 * sp - i * 0.85) * i * 0.22;
    out.push({ x: S[i].x + nx / d * w, y: S[i].y + ny / d * w });
  }
  return out;
}
function resetScarf(R) { R.scarf = []; for (let i = 0; i < 12; i++) R.scarf.push({ x: R.p.x - i * 2.6 * R.p.face, y: R.p.y - 19.5 + i * 0.6, px: R.p.x - i * 2.6 * R.p.face, py: R.p.y - 19.5 + i * 0.6 }); }
function resetChase(R) { const c = R.chase; c.active = false; c.delay = 1.4; c.pos = c.axis === 'x' ? R.cp.x - 10 * T : R.cp.y + 10 * T; }
function revealCircle(R, x, y, rad, v) {
  const L = R.L, x0 = Math.max(0, Math.floor((x - rad) / T)), x1 = Math.min(L.W - 1, Math.floor((x + rad) / T));
  const y0 = Math.max(0, Math.floor((y - rad) / T)), y1 = Math.min(L.H - 1, Math.floor((y + rad) / T));
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    const i = ty * L.W + tx; if (!L.t[i]) continue;
    if (Math.hypot(tx * T + T / 2 - x, ty * T + T / 2 - y) < rad) { R.lit[i] = Math.max(R.lit[i], v); R.seen[i] = 1; }
  }
}

// ---------- particles ----------
function spawnP(R, o) { if (R.parts.length > 420) R.parts.shift(); R.parts.push(Object.assign({ vx: 0, vy: 0, g: 0, life: 1, max: 1, size: 1.5, add: true, drag: 0.98 }, o)); }
function burst(R, x, y, n, col, sp, opts = {}) {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = sp * (0.3 + Math.random() * 0.7); spawnP(R, Object.assign({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, col, life: 0.6 + Math.random() * 0.8, max: 1.4, size: 1 + Math.random() * 1.6 }, opts)); }
}
function dust(R, x, y, n, dir = 0) {
  for (let i = 0; i < n; i++) spawnP(R, { x: x + (Math.random() - 0.5) * 8, y: y - 1, vx: (Math.random() - 0.5) * 50 + dir * 30, vy: -Math.random() * 35, g: 60, col: R.pal.rim, life: 0.4 + Math.random() * 0.4, max: 0.8, size: 0.8 + Math.random(), add: true, a0: 0.35 });
}
function addNoise(R, x, y, r, kind) { R.noises.push({ x, y, r, kind, t: 0, done: false }); }

// ---------- actions ----------
function doEcho(R, silent) {
  const p = R.p;
  R.echoCd = ECHO_CD;
  R.rings.push({ x: p.x, y: p.y - 14, r: 4, prev: 0, a: 1 });
  if (!silent) { addNoise(R, p.x, p.y - 14, 10 * T, 'echo'); AU.echo(R.act); haptic('light'); }
  R.anim.echoT = 0.4;
  burst(R, p.x, p.y - 14, 10, R.pal.glow, 60, { a0: 0.6 });
}
function ringBell(R, b) {
  if (b.cd > 0) return;
  b.cd = 1.4; b.glow = 1; b.swing = 0.4;
  AU.bell(b.grp === 6 ? 1 : 1.26, clamp((b.x - R.p.x) / (8 * T), -1, 1));
  addNoise(R, b.x, b.y, 13 * T, 'bell');
  burst(R, b.x, b.y + 6, 14, R.pal.glow, 70, { a0: 0.7 });
  if (!R.doorOpen[b.grp]) {
    R.doorOpen[b.grp] = true; setTimeout(() => AU.door(), 250); R.shake = Math.max(R.shake, 3);
    for (const i of R.doorIdx) if (R.L.t[i] === b.grp) { R.lit[i] = 1; R.seen[i] = 1; }
  }
}
function wakeCrystal(R, cr) {
  if (cr.on) return; cr.on = true; AU.crystal();
  const L = R.L, rad = CRYSTAL_R;
  for (let ty = 0; ty < L.H; ty++) for (let tx = 0; tx < L.W; tx++) {
    const i = ty * L.W + tx; if (!L.t[i]) continue;
    if (Math.hypot(tx * T + T / 2 - cr.x, ty * T + T / 2 - cr.y) < rad) { R.clit[i] = 1; R.seen[i] = 1; }
  }
  burst(R, cr.x, cr.y, 26, R.pal.glow, 90, { a0: 0.8 });
}
function die(R) {
  if (R.dead > 0 || R.done || R.inv > 0 || window.__god) return;
  R.dead = 1.15; SAVE.deaths++; persist();
  AU.death(); haptic('heavy'); R.shake = Math.max(R.shake, 7);
  burst(R, R.p.x, R.p.y - 13, 40, R.pal.scarf.startsWith('#') ? R.pal.rim : R.pal.rim, 110, { a0: 0.9, drag: 0.95 });
}
function respawn(R) {
  R.p = newBody(R.cp.x, R.cp.y); R.inv = 1.2; resetScarf(R);
  for (const e of R.enemies) {
    if (e.st !== 'patrol') { e.st = 'patrol'; }
    if (Math.hypot(e.x - R.cp.x, e.y - R.cp.y) < 7 * T) { e.x = e.hx; e.y = e.hy; e.vy = 0; }
  }
  for (const i of R.crumbIdx) R.crumb[i] = 0;
  R.rings.length = 0;
  if (R.chase) resetChase(R);
  revealCircle(R, R.p.x, R.p.y - 14, 4 * T, 0.7);
  burst(R, R.p.x, R.p.y - 13, 24, R.pal.glow, 50, { a0: 0.7 });
}

// ---------- simulation step ----------
function update(R, inp, dt) {
  R.time += dt;
  const p = R.p, L = R.L, W = R.world;
  // movers
  for (const m of R.movers) {
    const len = Math.hypot(m.bx - m.ax, m.by - m.ay); m.dx = m.dy = 0;
    if (!len) continue;
    if (m.wait > 0) { m.wait -= dt; continue; }
    m.u += m.dirm * 46 * dt / len;
    if (m.u >= 1) { m.u = 1; m.dirm = -1; m.wait = 0.8; } else if (m.u <= 0) { m.u = 0; m.dirm = 1; m.wait = 0.8; }
    const e = 0.5 - 0.5 * Math.cos(Math.PI * m.u);
    const nx = lerp(m.ax, m.bx, e), ny = lerp(m.ay, m.by, e);
    m.dx = nx - m.x; m.dy = ny - m.y; m.x = nx; m.y = ny;
  }
  if (R.inv > 0) R.inv -= dt;
  if (R.dead > 0) { R.dead -= dt; if (R.dead <= 0) respawn(R); }
  else if (!R.done) {
    if (!R.started && (inp.l || inp.r || inp.jp)) R.started = true;
    const wasGround = p.ground;
    stepBody(p, inp, W, dt);
    for (const ev of p.ev) {
      if (ev === 'jump') { AU.jump(); dust(R, p.x, p.y + 26, 6); R.anim.sy = 1.2; R.anim.sx = 0.84; }
      else if (ev === 'djump') { AU.djump(); burst(R, p.x, p.y, 12, R.pal.glow, 70, { a0: 0.6 }); R.anim.sy = 1.15; R.anim.sx = 0.88; }
      else if (ev === 'wjump') { AU.jump(); dust(R, p.x - p.face * 6, p.y - 8, 6, p.face); R.anim.sy = 1.12; R.anim.sx = 0.9; }
      else if (ev === 'land') {
        const fall = p.fall || 0, k = clamp(p.landV / 700, 0, 1);
        R.anim.sy = 1 - 0.3 * k; R.anim.sx = 1 + 0.25 * k;
        if (fall > 4.5 * T) { addNoise(R, p.x, p.y, 7 * T, 'land'); R.shake = Math.max(R.shake, 4); AU.land(1); haptic('medium'); dust(R, p.x, p.y, 14); }

// ---------- rendering ----------
function bgFor(act) {

  const c = mkCanvas(Math.ceil(VW / 2), Math.ceil(VH / 2)), g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, c.height); gr.addColorStop(0, pal.top); gr.addColorStop(1, pal.bot);
  g.fillStyle = gr; g.fillRect(0, 0, c.width, c.height);
  const rg = g.createRadialGradient(c.width * 0.5, c.height * 0.7, 0, c.width * 0.5, c.height * 0.7, Math.max(c.width, c.height) * 0.7);

function renderDarkness(R, ox, oy, s, vx0, vx1, vy0, vy1) {

  for (const m of R.mems) if (!m.got || m.had) Lt(m.x, m.y, 1.8 * T, m.had ? 0.2 : 0.55);
  for (const m of R.movers) Lt(m.x + m.w / 2, m.y + 3, 1.6 * T, 0.35);

function hintText(s) {

}

}

  const fs = clamp(VW / 24, 15, 19);

  let best = -1, bd = 1e9;
  R.L.hints.forEach((h, k) => { const d = Math.hypot(p.x - h.x, (p.y - h.y) * 1.3); if (Math.abs(p.x - h.x) < 5.5 * T && Math.abs(p.y - h.y) < 5 * T && d < bd) { bd = d; best = k; } });
  R.L.hints.forEach((h, k) => {
    const near = k === best && R.hintA.every((a, j) => j === k || a < 0.05);
    R.hintA[k] = clamp(R.hintA[k] + (near ? 0.03 : -0.03), 0, 1);
    const a = R.hintA[k]; if (a <= 0) return;
    const txt = hintText(R.def.hints[h.n] || ''); if (!txt) return;
    const maxW = Math.min(300, VW - 48), lines = wrapLines(c, txt, maxW);
    let sx = (h.x - R.cam.x) * s + VW / 2, sy = (h.y - R.cam.y) * s + VH / 2 - 26 - (lines.length - 1) * fs * 0.6;

    lines.forEach((ln, j) => c.fillText(ln, sx, sy + j * fs * 1.25));
    c.shadowBlur = 0; c.shadowColor = 'transparent';
  });

}

function buildVignette() {
  vignetteC = mkCanvas(Math.ceil(VW / 2), Math.ceil(VH / 2));
  const g = vignetteC.getContext('2d'), w = vignetteC.width, h = vignetteC.height;
  const gr = g.createRadialGradient(w / 2, h * 0.45, Math.min(w, h) * 0.25, w / 2, h / 2, Math.max(w, h) * 0.75);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.72)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);

}

/* ===== UI, input, flow, main loop ===== */

function touchPref() { return SAVE.set.touch == null ? IS_TOUCH_DEV : SAVE.set.touch; }

// ---------- input ----------
const INP = { l: false, r: false, jh: false, jpQ: false, echoQ: false };
const TCH = { l: false, r: false, j: false };
const DBG = { l: false, r: false, j: false };
const KEYMAP = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', Space: 'j', ArrowUp: 'j', KeyW: 'j', KeyZ: 'j', KeyK: 'j', KeyE: 'e', ShiftLeft: 'e', ShiftRight: 'e', KeyX: 'e', KeyJ: 'e' };
const keysDown = {};
addEventListener('keydown', e => {
  unlockAudio();
  const k = KEYMAP[e.code];
  if (k) { e.preventDefault(); }
  if (e.code === 'Escape' || e.code === 'KeyP') { if (MODE === 'play') pauseGame(); else if (MODE === 'pause') resumeGame(); return; }
  if (e.code === 'KeyM') { toggleMute(); return; }

  if (MODE === 'done' && (e.code === 'Space' || e.code === 'Enter')) { $('dNext').click(); return; }

addEventListener('blur', () => { for (const k in keysDown) keysDown[k] = false; TCH.l = TCH.r = TCH.j = false; if (MODE === 'play') pauseGame(); });

const ptrMap = new Map();
function tbAt(x, y) { const el = document.elementFromPoint(x, y); const b = el && el.closest && el.closest('.tb'); return b ? b.dataset.k : null; }
function refreshTouch() {
  const set = { l: false, r: false, j: false };

  if (set.j && !TCH.j) INP.jpQ = true;

$('touch').addEventListener('pointerdown', e => {

addEventListener('pointermove', e => {

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (!e.target.closest('.scr')) e.preventDefault(); }, { passive: false });

// ---------- flow ----------
function titleScreen() {
  MODE = 'title'; setTouch(false);
  if (!TITLE_RUN) { TITLE_RUN = makeRun(TITLE_MAP, -1); TITLE_RUN.p.face = 1; }
  RUN = TITLE_RUN; setAct(0);
  updateCamera(RUN, 0, true);
  $('hud').classList.add('hidden');
  UI.show('scrTitle');
  const hasProg = SAVE.unlocked > 0 || Object.keys(SAVE.done).length > 0;
  $('bContinue').classList.toggle('hidden', !hasProg);
  $('bNew').textContent = hasProg ? 'Начать сначала' : 'Начать историю';
  if (audioUnlocked) AU.ambient(0, 0.7);
  AU.stopChase();
  fade(false);
}

function startLevel(li, opts = {}) {
  li = clamp(li, 0, LEVELS.length - 1);
  fade(true, () => {
    RUN = makeRun(MAPS[li], li);
    SAVE.cur = li; persist();
    setAct(RUN.act);
    MODE = 'play'; UI.hideAll();
    setTouch(touchPref());
    updateCamera(RUN, 0, true);
    $('hud').classList.remove('hidden');
    const ln = $('lvlName'); ln.innerHTML = `${ACTS[RUN.act].roman} · ${LEVELS[li].id}<b>${LEVELS[li].name}</b>`; ln.style.opacity = 1;
    setTimeout(() => { if (RUN && RUN.li === li) ln.style.opacity = 0; }, 3500);
    UI.memHud(RUN);
    if (audioUnlocked) AU.ambient(RUN.act, 1);
    AU.stopChase();
    fade(false, null, 900);
  }, opts.fast ? 250 : 600);
}

function playStory(lines, cb, opts = {}) {
  MODE = 'story'; setTouch(false);
  $('hud').classList.add('hidden');
  UI.show('scrStory');
  const box = $('storyText'); box.innerHTML = '';
  STORYSTATE.lines = lines; STORYSTATE.i = 0; STORYSTATE.cb = cb; STORYSTATE.busy = false;
  storyAdvance();
}
const STORYSTATE = { lines: [], i: 0, cb: null, lock: 0 };
function storyAdvance() {
  const S = STORYSTATE, box = $('storyText');
  if (performance.now() < S.lock) return;
  S.lock = performance.now() + 450;
  if (S.i >= S.lines.length) { const cb = S.cb; S.cb = null; if (cb) cb(); return; }
  const ln = S.lines[S.i++];
  // clear the page when the next line starts a new "chapter" (caption) or after 3 lines
  if (ln.c === 'cap2' || box.children.length >= 3) box.innerHTML = '';
  for (const p of box.children) p.classList.add('old');
  const p = document.createElement('p'); p.textContent = ln.t; if (ln.c) p.className = ln.c;
  box.appendChild(p); requestAnimationFrame(() => requestAnimationFrame(() => p.classList.add('in')));

}

function onLevelComplete(R) {
  const li = R.li;
  SAVE.done[li] = 1; SAVE.unlocked = Math.max(SAVE.unlocked, Math.min(LEVELS.length - 1, li + 1)); SAVE.cur = Math.min(LEVELS.length - 1, li + 1); persist();

  $('dName').textContent = LEVELS[li].name;
  $('dVoice').textContent = LEVELS[li].voice ? '«' + LEVELS[li].voice + '»' : '';

  const b = $('sReset');
  if (!b.dataset.arm) { b.dataset.arm = '1'; b.textContent = 'Точно стереть?'; setTimeout(() => { b.dataset.arm = ''; b.textContent = 'Стереть'; }, 3500); return; }
  const set = SAVE.set; SAVE = defSave(); SAVE.set = set; persist();
  b.textContent = 'Стёрто'; b.dataset.arm = '';
});

// ---------- resize ----------
function resize() {
  VW = Math.max(200, window.innerWidth); VH = Math.max(200, window.innerHeight);
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  SCALE = clamp(Math.min(VW / (12 * T), VH / (15 * T)), 1.05, 3.4) * (window.__zoom || 1);
  lightC.width = Math.ceil(VW / LD) + 1; lightC.height = Math.ceil(VH / LD) + 1;
  buildVignette();
  setTouch(IS_TOUCH);
  if (RUN) updateCamera(RUN, 0, true);
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));

// ---------- title scene behaviour ----------
function titleTick(R, dt) {
  R.titleT = (R.titleT || 0) + dt;
  if (R.titleT > 3.4) { R.titleT = 0; doEcho(R, true); if (audioUnlocked && MODE === 'title') AU.echo(0); }
  update(R, { l: false, r: false, jh: false, jp: false, echo: false }, dt);
  R.cam.x = R.p.x + 0; R.cam.y = R.p.y - (VH * 0.33) / SCALE;
}

// ---------- main loop ----------
let last = performance.now(), acc = 0;
const STEP = 1 / 60;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1;
  acc += dt;
  let steps = 0;
  while (acc >= STEP && steps < 5) {
    acc -= STEP; steps++;
    if (!RUN) break;
    if (RUN.title) titleTick(RUN, STEP);
    else if (MODE === 'play') update(RUN, readInput(), STEP);
    else if (MODE === 'ending' || MODE === 'done') {
      update(RUN, { l: false, r: false, jh: false, jp: false, echo: false }, STEP);
      if (MODE === 'ending' && RUN.endT >= 0) { RUN.endT += STEP; RUN.endLight = clamp(RUN.endT / 5, 0, 1); }
    }
  }
  if (acc > STEP * 5) acc = 0;
  if (RUN) {
    try { render(RUN); } catch (e) { console.error(e); }
    if (MODE === 'play') { const cd = clamp(1 - RUN.echoCd / ECHO_CD, 0, 1); $('tE').style.setProperty('--cd', cd.toFixed(3)); }
  }
}

// ---------- boot ----------
(function boot() {
  const word = 'ОТГОЛОСОК';
  $('titleWord').innerHTML = word.split('').map((ch, i) => `<span style="animation-delay:${(i * 0.37).toFixed(2)}s">${ch}</span>`).join('');
  if (TG) {
    try { TG.ready(); TG.expand(); if (TG.disableVerticalSwipes) TG.disableVerticalSwipes(); if (TG.setHeaderColor) TG.setHeaderColor('#03080b'); if (TG.setBackgroundColor) TG.setBackgroundColor('#03080b'); } catch (e) {}
  }
  IS_TOUCH = touchPref();
  resize();
  if (!IS_TOUCH_DEV) $('titleFoot').textContent = 'в наушниках — лучше · ← → прыжок: пробел · эхо: E';
  titleScreen();
  requestAnimationFrame(t => { last = t; frame(t); });
})();

// ---------- debug hook ----------
window.__game = {
  get mode() { return MODE; },
  state() { const R = RUN; return R ? { mode: MODE, li: R.li, x: R.p.x, y: R.p.y, tx: Math.floor(R.p.x / T), ty: Math.floor(R.p.y / T), ground: R.p.ground, dead: R.dead, done: R.done, mems: R.mems.map(m => m.got), chase: R.chase && R.chase.pos } : null; },
  load(li) { startLevel(li, { fast: true }); },
  teleport(tx, ty) { const R = RUN; R.p.x = tx * T + T / 2; R.p.y = (ty + 1) * T; R.p.vx = R.p.vy = 0; resetScarf(R); updateCamera(R, 0, true); },
  toGoal() { const g = RUN.goal; this.teleport(g.tx, g.ty); },
  complete() { const R = RUN; if (R && R.goal) { R.p.x = R.goal.x; R.p.y = R.goal.y + 13; } },
  input(o) { Object.assign(DBG, o); },
  tap(k) { if (k === 'j') INP.jpQ = true; if (k === 'e') INP.echoQ = true; },
  next() { $('dNext').click(); },
  story() { storyAdvance(); },
  skipStory() { $('storySkip').click(); },
  ending() { SAVE.unlocked = 14; this.load(14); setTimeout(() => this.complete(), 900); },
  god(v) { window.__god = v; },
  zoom(z) { window.__zoom = z; resize(); },
  save: () => SAVE,
};

</script>
